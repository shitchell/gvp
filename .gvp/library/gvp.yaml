  - id: D56
    name: Registry deletion is safe; rebuild is lossy and incremental
    rationale: |
      D22 argued for the word "registry" over "cache" on the grounds that the data cannot be regenerated without re-running cairn in every project ever touched, so "cache" -- which implies safe to delete and the tool will rebuild -- would be misleading. Issue #15 requires the opposite framing: it must always be safe to delete and rebuild. Both are right about different halves, and neither label alone is honest.
      The accurate statement, and the one that gets documented: deleting the registry breaks nothing, but rebuilding is not automatic -- each library reappears only when cairn next resolves it. It is therefore safe to delete and safe to treat as disposable, while remaining lossy to delete. Stating both halves is preferred to collapsing to either label, per V3 and P12 ("Surface tension, don't resolve it").

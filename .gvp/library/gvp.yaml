  - id: D58
    name: Library facts are recorded without project context; the usage edge is skipped
    rationale: |
      Invoking cairn with an explicit library path outside any project still records the library facts, because those facts are complete on their own -- name, source, document path, filename, scope, and element counts require no project to be meaningful. Only the usage edge is skipped, since there is no project to attribute it to. Recording partial truth beats recording nothing, and the alternative (no-op without project context, as D22's registry preflight does) would silently lose every library reached this way.

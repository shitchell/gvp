  - id: D51
    name: Split registry writes by write-shape
    rationale: |
      Registry state is split by whether concurrent writers produce identical content, not by subject matter. Library facts -- name, source, document path, filename, scope, element counts, and the correlation fields -- are derived purely from the library's current content, so two writers observing the same library state write identical bytes and a lost update is a no-op, per P18. The usage edge, which differs between writers, lives in the project's own file.
      Two writers observing DIFFERENT library states (the library changed between their catalog builds) write different element counts, and that resolves last-write-wins. This is correct rather than merely tolerable: the later observation is the fresher one.
      Critically, ALL timestamps live on the usage edge and never on the library entry. The first draft of this design put first_seen and last_seen on the library entry while claiming writes were byte-identical, which was false and would have voided the entire no-lock argument. A single per-writer field destroys the property; see P18.
      A single index file holding every entry was rejected: every invocation would be a read-modify-write on one file, losing updates under C2. Full inversion -- storing library facts inside each project entry -- was rejected as denormalization, since element-count copies would drift apart as libraries change and enumeration would have to reconcile disagreeing copies.
    tags:
      - framework
      - tooling
      - integrity
    maps_to:
      - gvp:G6
      - gvp:V10
      - gvp:P18
      - gvp:C2
    considered:
      single_index_file:
        rationale: |
          One registry file holding every entry would make enumeration a single file read and would be trivially inspectable by hand, but every invocation becomes a read-modify-write on one file, which loses updates or corrupts it outright under concurrent agent sessions.
        would_have_served:
          - gvp:V5
        conflicts_with:
          - gvp:C2
      full_inversion_into_project_entries:
        rationale: |
          Storing library facts inside each project's D22 entry inherits per-project write separation, but denormalizes: the same library's element counts are copied into every project entry that uses it, and those copies drift as the library changes.
        would_have_served:
          - gvp:V4
        conflicts_with:
          - gvp:V2
      timestamps_on_the_library_entry:
        rationale: |
          Mirroring D22's project-entry schema by putting first_seen and last_seen on the library entry was the first draft, and was rejected on review: it makes concurrent writes non-identical and silently voids the argument for not locking, while leaving the code that depends on that argument unchanged.
        would_have_served:
          - gvp:V2
        conflicts_with:
          - gvp:P18
    origin:
      - date: '2026-09-03'
        note: Chosen after recognizing that a library index breaks D22's per-project no-collision property, then corrected on review when the first draft was found to have violated its own idempotence premise.

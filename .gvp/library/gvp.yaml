  - id: D46
    name: Entries are keyed by source identity, not by name or UUID
    rationale: |
      The key is the canonicalized source string plus the document path -- unique after canonicalization, always available, and requiring no new identity concept. meta.name is emphatically not unique: a file named personal.yaml appears in sixteen locations on the author's machine, six of them cached refs of one published library. A library UUID would be the natural key but does not exist in documentMetaSchema and cannot be minted locally without violating R9.
      Keying on source rather than on the RESOLVED filesystem path matters for remote libraries, whose resolved path embeds a cache directory subject to eviction and future relocation; path-keying would mint duplicate entries when that directory moves. For local libraries the canonicalized source IS the resolved library directory, so the two coincide.
      Note the document path carries no file extension -- it is the extension-stripped relative path cairn already uses as document identity -- so the actual filename is stored separately, since whether a document is .yaml or .yml is not derivable from it.
    tags:
      - framework
      - tooling
      - integrity
    maps_to:
      - gvp:G6
      - gvp:V10
      - gvp:R9
      - gvp:D45
    considered:
      key_by_meta_name:
        rationale: |
          Keying by meta.name was rejected because names are not unique across libraries -- a personal.yaml exists in sixteen places on one machine, six of them cached remote refs.
        conflicts_with:
          - gvp:V10
      key_by_library_uuid:
        rationale: |
          Keying by a library UUID is the natural design but no such field exists, and minting one locally on fetch would differ per consumer per R9. Tracked upstream as issue #16; this design reads library_id if present.
        would_have_served:
          - gvp:V10
        conflicts_with:
          - gvp:R9
      key_by_resolved_filesystem_path:
        rationale: |
          Keying by the resolved absolute path was the initial proposal, corrected during review: for remote libraries the resolved path embeds a cache directory subject to eviction and relocation, so moving it would silently duplicate every remote entry.
        would_have_served:
          - gvp:V4
        conflicts_with:
          - gvp:V10

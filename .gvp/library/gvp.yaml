        identifier: resolveDiagnosticsOverride
        role: implements
    origin:
      - date: '2026-09-25'
        note: 'Issue #29, filed after wiring `@github:shitchell/gvp-docs@v0.7.0` into this repo surfaced 49 unfixable inherited warnings against 99 local ones. The cautionary tale in the issue -- three months of unnoticed W003 accretion behind a blanket `suppress_diagnostics` in the library author''s own config -- is what forced the tri-state and the mandatory `hide` trace, and it was supplied as measured evidence rather than as a hypothetical.'
      - id: 0a052f3b-4e49-49ab-a87b-5e1e9aac4aaa

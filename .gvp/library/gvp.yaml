  - id: D60
    name: A library's declared config governs its own writes, not its consumer's
    rationale: |
      A document-declared config override whose effect is a write side effect governs only the declaring library's own writes, never the consuming invocation's.

      Document-declared config (`meta.config_overrides`) resolves ancestor-wins across the inheritance chain. That is defensible for overrides describing how a library should be READ -- priority direction, definitions, anything about interpreting the ancestor's own elements -- because the ancestor genuinely knows more about its own content than its consumer does. It is indefensible for an override that causes or suppresses a WRITE, because the write lands in the consumer's environment, on the consumer's machine, over the consumer's data, and the consumer never opted in. Ancestor-wins there means authority over someone else's side effects acquired purely by being upstream of them.

      The measured instance: an inherited library carrying `config_overrides.registry.enabled: false` disables the CONSUMING project's entire registry -- including the consumer's own entries, which the ancestor has no view of and no stake in -- silently, at load time, for every command. That is a far larger effect than any statement the declaring library could reasonably have meant to make, and the consumer's only signal is that something stopped happening.

      So a declaration about a write side effect is read as a statement about the DECLARING library and applied to that library's own records only; it never propagates to the consumer's. Where a mechanism cannot be scoped that way, it must not be exposed as a document-declared override at all. This also fixes, in advance, what any library-scoped opt-out may mean once one is built: "do not record ME", never "do not record".

      NOT IMPLEMENTED BY THIS DECISION. It fixes the semantics that any implementation must satisfy; `src/catalog/catalog.ts` still applies every override ancestor-wins over the whole invocation. Issue #25 carries the implementation.
    tags:
      - framework
      - integrity
      - tooling
    maps_to:
      - gvp:G5
      - gvp:V10
      - gvp:V8
      - personal:V4
      - personal:R2
    considered:
      ancestor_wins_governs_the_whole_invocation:
        rationale: |
          Leave the behaviour as built: every `meta.config_overrides` key, including write-affecting ones, resolves ancestor-wins across the whole consuming invocation. This is the status quo and has the single genuine merit of one uniform precedence rule -- a reader learns "ancestor-wins" once and it holds for every key, with no read/write taxonomy to consult and no per-key exceptions to remember. Rejected because the measured hazard is not a corner case: an inherited library carrying `registry.enabled: false` silently disables the consuming project's entire registry, including entries the ancestor has no view of, for every command, with no signal beyond something quietly no longer happening. A uniform rule is not worth the ancestor holding unrequested authority over the consumer's side effects, and the failure is invisible rather than loud, which is the worst available shape for it.
        would_have_served:
          - gvp:V4
          - personal:V1
        conflicts_with:
          - gvp:V10
          - personal:V4
      forbid_write_affecting_overrides_entirely:
        rationale: |
          Refuse to let a document declare any override whose effect is a write, and diagnose the attempt. This is the strictly safest reading and needs no scoping mechanism at all. Rejected as broader than the hazard: it would also refuse the legitimate, narrow statement a library has standing to make about ITSELF ("do not record me"), which is exactly the surface #25 is trying to build. Scoping the declaration to the declaring library removes the hazard without removing the capability, so the blanket refusal pays a real cost for no additional safety.
        would_have_served:
          - gvp:V10
          - gvp:V4
        conflicts_with:
          - gvp:V8
          - personal:V7
      consumer_opts_in_to_inherited_write_overrides:
        rationale: |
          Keep ancestor-wins, but require the consuming library to list which inherited write-affecting overrides it accepts, so nothing lands unrequested. Rejected under C1 and G8: it makes correctness depend on a consumer knowing in advance that an ancestor might declare such a thing and writing a config stanza about it, which is precisely the "a feature that must be discovered before it works" failure D43 was written against. The default for a consumer who does nothing must already be the safe one.
        would_have_served:
          - personal:V4
        conflicts_with:
          - gvp:C1
          - gvp:G8
    origin:
      - date: '2026-09-25'
        note: 'Authored against a measured hazard: meta.config_overrides is ancestor-wins (src/catalog/catalog.ts), so an inherited library carrying config_overrides.registry.enabled false silently disables the consumer''s whole registry. Surfaced while scoping issue #25; written to bind every future document-declared override with a write side effect, not only the registry one.'
      - id: a5a96a81-65b6-4b0a-bb02-3afb294e4688
        date: '2026-09-25T21:21:17.379Z'
        note: Imported from patch-guidance.yaml
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
      - date: '2026-09-25'
        note: Reclassified from rule gvp:R11 to decision gvp:D60 on maintainer review, before any dependant shipped. It describes what cairn DOES at runtime, observable by a user -- product behaviour -- rather than how this project operates while writing code; contrast gvp:R6, which constrains the code we write. By the source test it originated in the design phase, which makes it an architectural decision. The body is preserved as the decision's rationale; `considered` alternatives were added on conversion, since a rule states a constraint while a decision must show what it was chosen over. R11 is retired and its id is never reused (R1).
  - id: D61
    name: Catalog enumerations get a --list <type> selector on query
    rationale: |
      A project needs to know which documents the library it will ACTUALLY USE contains, with element counts, so an agent can decide at session start which documents bear on its task (#24). That view ships as `cairn query --list documents`, with `--list <type>` reading its vocabulary from a listing registry and `--format` unchanged.

      WHERE IT GOES is settled by H10 and not re-argued here: the question names the resolved catalog as its store, so it belongs on a catalog-building command. `libs` reads the machine-global registry, which cannot answer it -- `mergeUsageEdges` is a union that never prunes (src/registry/usage-edge.ts), so a `libs list --resolved` would mean "ever resolved", and D41 makes the registry a strict superset of what this invocation actually resolves. An answer that is merely usually right is the failure V10 names.

      WHY A SELECTOR RATHER THAN A FORMAT. `--format documents` conflates the two axes: a format says HOW to render, a selector says WHAT to enumerate. personal:P3 ("separate what from how at every layer") forbids the merge, and the practical cost is immediate -- once `documents` is a format, there is no way to ask for the listing as JSON, because the slot that would have said so is already spent.

      WHY ONE PARAMETERISED FLAG RATHER THAN A FLAG PER VIEW. `--list-documents`, `--list-tags`, `--list-sources` is the near-duplicate-entry-point shape personal:P8 exists to refuse. One flag whose argument is looked up in a registry (src/listings/registry.ts, shaped after createExporterRegistry per P15) means the next enumeration is a class plus one registration, with no change to the command and no new flag to document. It also composes by construction: `--list documents --format json` needs no special case, and the accepted vocabulary and the help text are the same data, so they cannot drift.

      THE SHAPE OF THE ANSWER. Rows carry `name`, `document_path`, `source`, `description`, `scope`, `element_counts` and `element_total`, and the schema is additive only (code-common:CP11) because an agent-facing ruleset reads it (D54). `description` is `meta.description`, which D18 promoted to a first-class field for exactly this session-start-index use. Counts are keyed by the category's schema `yaml_key`, resolved through the registry rather than written out, mirroring src/registry/record.ts -- hard-coding the built-in names would silently report zero for a user-defined category (R6). Field names deliberately match `libs list --json` for the facts the two share, so the registry view and the catalog view can be joined rather than translated.

      THE TRAP THIS DESIGN EXISTS TO AVOID. Rows are derived from `catalog.documents`, NEVER from the element output. A document that is tags-only, or whose elements are all deprecated, contributes no elements to any filtered view and would disappear entirely from an element-derived listing -- undercounting the catalog with nothing to say so. That is the silent-miss class D54 was written against, and both cases are pinned by tests.

      FILTERS SPLIT ALONG THE SAME SEAM. `--document` selects documents, so it restricts which ROWS appear. The element filters (`--category`, `--tag`, `--status`, `--include-deprecated`, the ref filters) restrict which elements are COUNTED, and never remove a row. A filter that matches nothing yields every document at zero, which is an answer; a filter that made documents vanish would be the trap above by another route.

      ALSO IN SCOPE: `query --format json` gains `_document`, `_documentPath` and `_source`. Issue #24 asked for a document field; three are needed because `_canonicalId` cannot be split back apart -- `source` may itself contain `:` (`@github:org/repo`), so string-splitting it is not a substitute (P14) -- and because document names are not unique across inherited libraries (D46), which makes the name alone an unsound join key. The three fields are exactly the row key `--list documents` emits, so element output and the listing join on equality.
    tags:
      - tooling
      - usability
      - extensibility
    maps_to:
      - gvp:G7
      - gvp:G11
      - gvp:V6
      - gvp:V10
      - gvp:H10
      - gvp:D54
      - gvp:D18
      - personal:P3
      - personal:P8
      - code-common:CP11
    considered:
      libs_list_resolved:
        rationale: |
          A `--resolved` flag on `cairn libs list`, filtering the machine-global registry down to the entries this project resolved. Refused on the store test (H10) and on a verified mechanism, not on taste: the usage edge is a UNION that never prunes (mergeUsageEdges, src/registry/usage-edge.ts), so an entry a project resolved once stays attached to it forever -- a document deleted, renamed, or removed from `inherits:` still appears. D41 states the registry is a strict superset of what actually resolves. "Resolved" would therefore mean "ever resolved", and the answer would be right often enough to be trusted and wrong without warning, which is precisely the guarantee V10 requires to be reliable or visibly absent.
        would_have_served:
          - personal:P8
        conflicts_with:
          - gvp:V10
          - gvp:H10
          - gvp:D41
      format_documents:
        rationale: |
          `cairn query --format documents`, reusing the existing format slot rather than adding a flag. Refused: a format is HOW output is rendered, not WHAT is selected, and merging the two violates personal:P3. The cost is concrete rather than theoretical -- spending the format slot on the selector leaves no way to ask for the listing as JSON, which is the one output D54 requires, and every future enumeration would have to be smuggled in as another pseudo-format.
        would_have_served:
          - personal:V1
        conflicts_with:
          - personal:P3
          - gvp:D54
      list_documents_boolean_flag:
        rationale: |
          A dedicated `--list-documents` boolean. Simplest possible change and correctly separates what from how. Refused because it does not survive its second instance: tags, sources and categories are all plausible enumerations over the same catalog, and each would arrive as another near-duplicate flag -- the shape personal:P8 refuses. The parameterised flag costs one registry lookup and makes the next view free.
        would_have_served:
          - personal:V1
        conflicts_with:
          - personal:P8
      list_all_type_spelling:
        rationale: |
          Spelling the flag `--list-all <type>` rather than `--list <type>`; identical mechanism, different word. Set aside on readability: "all" invites the reading that it overrides the sibling filters, when in fact `--document` does restrict which rows appear, so the word would be making a promise the flag does not keep. `--list <type>` also parallels `--format <fmt>` -- flag names the axis, argument names the choice. Recorded because the maintainer floated the longer spelling; it is a one-word rename if preferred, with no design consequence either way.
        would_have_served:
          - gvp:V6
      route_query_formats_through_the_exporter_registry:
        rationale: |
          Fixing the standing P15/R6 violation in query.ts first -- it imported createExporterRegistry without using it and hand-rolled its format switch -- by routing query's formats through the same registry `export` uses. Refused for this change after reading both paths: the format NAMES collide but the formats do not. `query --format json` emits a flat array of elements while JsonExporter emits `{documents, categories, tags}`; `query --format csv` emits five columns while CsvExporter emits the reserved set plus every dynamic field. Worse, `ExportOptions` carries only `includeDeprecated` and `documentFilter`, so an exporter handed this catalog would silently re-derive the unfiltered element set and ignore `--category`, `--tag`, `--status` and the ref filters. Unifying them means changing the Exporter contract and breaking two output shapes -- including the very output #24 extends. The dead import was deleted and the divergence is now documented at the switch, so the next reader does not mistake it for an abandoned refactor.
        would_have_served:
          - gvp:P15
          - gvp:R6
        conflicts_with:
          - gvp:V10
          - personal:V5
    origin:
      - date: '2026-09-25'
        note: 'Issue #24, filed while defining how agents in the ~/wmd framework load GVP at session start. The issue deliberately left syntax to this project to settle against its own library; H10 (authored days earlier for exactly this question) settled the command, and personal:P3 and personal:P8 settled the flag shape.'
    refs:
      - file: src/listings/base.ts
        identifier: Listing
        role: defines
      - file: src/listings/documents-listing.ts
        identifier: DocumentsListing
        role: implements
      - file: src/listings/registry.ts
        identifier: createListingRegistry
        role: implements
      - file: src/cli/commands/query.ts
        identifier: queryCommand
        role: implements
  - id: D63
    name: A definition is read in the library that authored it, at every element-keyed lookup
    disposition: accepted
    rationale: |
      DEC-2.12 promised that "overriding a definition doesn't retroactively change the meaning of ancestor elements." The accessor built to deliver it, `Catalog.getSourceSnapshot`, had exactly one caller repo-wide and it was a test; every validation pass read the flat descendant-wins merged registry instead (#27). The promise was documented and unenforced -- the failure V10 names, made worse by being written down. It had not bitten only because no library in play declares `meta.definitions.categories`: neither this repo's nor any of the six documents in gvp-docs@v0.7.0, so every source resolved to `src/data/defaults.yaml` verbatim and the flat lookup happened to return the right answer. Latent, not benign.

      THE RULE. A lookup keyed to an ELEMENT is answered by that element's own library's registry: `catalog.categoryFor(element)`. A lookup that is a library-wide question with no owning element -- which categories may a user type at the CLI, which columns does an export carry -- keeps reading `catalog.registry`, the flat merged view DEC-2.1 defines. The split is the whole design: both views are legitimate, and the bug was using one where the other was meant.

      IT APPLIES TO EVERY DEFINITION-DERIVED BEHAVIOUR, NOT JUST `mapping_rules`. `is_root` decides whether an element is exempt from anchoring at all (W001, W004, W005, W014); `requires_decision` drives W018; `is_value_anchor` drives W017. A descendant redefining any of them flips ancestor elements between states they were never authored in. And the defect is symmetric: a descendant that TIGHTENS a rule retroactively invalidates ancestor elements that were always valid, while one that LOOSENS it silently stops enforcing the ancestor's stricter contract -- the second direction is the more dangerous, because it reports nothing.

      IN A TRANSITIVE WALK, EACH NODE ANSWERS FOR ITSELF. W014 and W017 walk the maps_to graph asking "is this a root" / "is this a value anchor" of every node reached. Those are questions about the WALKED node's library, not the starting element's, so the per-element rule is applied at every step rather than once at the top. A decision in a child library that anchors to a parent's element is therefore anchored if the PARENT calls that category an anchor, even where the child does not. The alternative -- freezing the starting element's view over the whole walk -- would have one library's definitions govern another's elements again, just one hop later.

      JUDGEMENT CALL 1: WHAT GOVERNS A LOCAL ELEMENT UNDER AN INHERITED DEFINITION. DEC-2.12 speaks only to ancestors and is silent here. Settled as: the definitions VISIBLE to a library are its own layered over those of the libraries it inherits, transitively -- descendants and siblings contribute nothing. So a local element IS governed by an inherited stricter definition when the local library declares none of its own. This is the reading that makes an inherited definition mean something: the opposite (undeclared falls back to built-ins) would make inheriting a library's category definitions a no-op unless every consumer re-declared them, which defeats G11 and contradicts DEC-2.1's whole merge model. It also keeps one rule rather than two -- "a library sees upstream, never downstream" answers both the ancestor case DEC-2.12 asked about and the local case it did not.

      That rule forced the per-source snapshots to be recomputed rather than merely consumed. The previous computation captured, for each source, the cumulative merge AT THE MOMENT THAT SOURCE'S FIRST DOCUMENT WAS REACHED, which is wrong three ways: a library whose definitions live in its SECOND document never saw its own; `orderedDocuments` is the DFS orders of several leaf documents concatenated, so a document's predecessors include sibling branches and unrelated leaves that are not its ancestors at all; and under `priority.definitions: ancestor` the list is reversed, making the prefix meaningless. Snapshots are now computed per source over exactly the documents that source can see, through the same merge function the global view uses -- so a snapshot can never drift from the global merge in RULES, only in SCOPE.

      JUDGEMENT CALL 2: PERFORMANCE. Per-source registries are memoized on the Catalog, keyed by source, so resolution is O(number of libraries) and never O(number of elements) even though it is invoked per element inside four passes. The memo is a cache and changes no answer; correctness was not traded for it. Stated rather than left implicit because the honest alternative -- resolving per element and letting it cost what it costs -- differs only in speed, and a future reader should know which was chosen and why.

      SCOPE NOT COVERED. `structural-pass.ts` (E001/E005 schema lookups, W009 id-prefix scanning), the CLI commands and the exporters still read the flat registry. Some of those are correct as library-wide questions; others are the same defect in a different file. They were left alone because they were owned by other work in flight, not because they were audited and cleared -- naming that here rather than implying a completeness this change does not have.
    tags:
      - framework
      - integrity
      - tooling
    maps_to:
      - gvp:G5
      - gvp:G11
      - gvp:V2
      - gvp:V10
      - gvp:V3
      - gvp:R6
      - personal:H5
      - personal:R2
    considered:
      flat_registry_amend_the_promise:
        description: Leave the passes on the merged registry and amend DEC-2.12 to say definitions are global.
        rationale: |
          Rejected. It is the cheapest way to make the documentation true, and it has the virtue of describing what the code already does. But it discards the guarantee rather than the gap: an ancestor library's elements would be permanently at the mercy of whatever any descendant later declares, so a library could not be published and relied upon -- exactly the cross-library reuse G11 exists to enable. It also makes a library's own validation result depend on who imports it, which is not a property a publisher can reason about.
        would_have_served:
          - gvp:V4
        conflicts_with:
          - gvp:G11
          - gvp:V10
          - gvp:V2
      defaults_for_undeclared_libraries:
        description: A library that declares no definition of its own falls back to the built-in defaults rather than inheriting its ancestors'.
        rationale: |
          Rejected. It is a defensible reading of "each library is judged by its own definitions" and it is simpler to state. But it makes inheriting definitions useless: a consumer would have to re-declare every category it wanted to honour, and an org library's tightened `mapping_rules` would silently not apply to the projects that inherit it -- which is the entire reason to put them upstream. It also splits the rule in two, one for ancestors and one for locals, where "a library sees upstream, never downstream" covers both.
        would_have_served:
          - gvp:V4
          - gvp:P14
        conflicts_with:
          - gvp:G11
          - gvp:V2
      keep_the_existing_snapshot_computation:
        description: Consume `getSourceSnapshot` as it was already computed, changing only the call sites in the passes.
        rationale: |
          Rejected on evidence, not on taste. It is the minimal diff and the one the issue suggests, but the stored snapshot was a cumulative prefix of the document order, which is not the ancestor closure: it misses a library's own later documents, admits sibling branches and unrelated leaves, and inverts under `priority.definitions: ancestor`. Shipping the call-site change over it would have produced a fix that is right in the two-library demo and wrong in the arrangements this project actually resolves -- the answer that is usually right, which V10 refuses.
        would_have_served:
          - gvp:V4
          - personal:V1
        conflicts_with:
          - gvp:V10
          - personal:R1
      resolve_per_element_without_memoizing:
        description: Build the per-source registry on every element lookup instead of caching it.
        rationale: |
          Set aside, not rejected -- it is semantically identical, and that is the point of recording it. It would re-read and re-parse `defaults.yaml` once per element per pass. The memo is keyed by source rather than by element precisely so that no semantics ride on it: if the cache were dropped tomorrow every diagnostic would be unchanged.
        would_have_served:
          - personal:V1
    origin:
      - date: '2026-09-25'
        note: 'Issue #27. DEC-2.12 (docs/plans/2026-03-02-v1-design-decisions.md:601-609) stated the guarantee; this decision states how it is enforced and settles the two questions DEC-2.12 left open -- what governs a local element under an inherited definition, and whether the per-node rule applies inside a transitive walk.'
      - id: a1d602d3-1eb9-44f4-8d87-1de03188eb1d
        date: '2026-09-25T22:45:13.920Z'
        note: Imported from dec27-patch.yaml
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
    refs:
      - file: src/catalog/catalog.ts
        identifier: Catalog
        role: implements
      - file: src/catalog/category-merger.ts
        identifier: mergeDefinitions
        role: implements
      - file: src/catalog/category-merger.ts
        identifier: buildSourceVisibility
        role: implements
      - file: src/catalog/category-merger.ts
        identifier: mergeOver

  - id: D42
    name: Hook recording at catalog construction, not per-command
    rationale: |
      buildCatalog() is the single choke point for library LOADING -- 11 of 13 command files call it. The two that do not are `init` (which creates a library rather than loading one) and `libs` (which reads the registry rather than building a catalog); `libs` did not exist when this was first written. It holds the resolved library directory across all three discovery paths (--library, --store, and cwd walk-back), the source cache keyed by every external source resolved, the resolver that maps those to paths and refs, meta.name per document, and per-document element counts. One hook there covers every present and future catalog-building command; per-command hooks would drift as commands are added and would re-derive the same facts.
      It does NOT hold project identity, and the first draft of this design wrongly assumed it did. runProjectPreflight is called inside parseConfigOptions, whose return value carries only the config and config options -- the PreflightResult is consumed and discarded. Recording the usage edge therefore requires a plumbing change: parseConfigOptions must return the PreflightResult and it must reach the recording function. The single-choke-point property is true of library loading, not of project identity.

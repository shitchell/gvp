          Wired to the guiding element authored from the same proposal. The rule half of #27 now exists as gvp:R13, so this decision maps up to it, the way it already maps up to gvp:R6. No field of the decision's own content changed -- only the maps_to link, which did not exist to be made when D63 was authored.

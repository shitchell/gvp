  - id: D10
    name: Scope inheritance with two-direction priority
    rationale: |
      GVP documents form an inheritance chain. Priority follows one DFS ordering but applies in two directions: for elements, ancestors win (org-wide standards override project-level); for definitions (tags, categories, field_schemas), descendants win (projects can extend and customize). Both directions are configurable. Elements that apply broadly live at higher scopes and are inherited by all descendants. The depth of nesting is user-defined.
    tags:

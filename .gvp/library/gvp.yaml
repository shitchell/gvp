  - id: D47
    name: Local libraries are keyed by resolved filesystem path, not by the source string
    rationale: |
      For LOCAL libraries the key is the resolved absolute filesystem path of the document -- the resolver's own output, with symlinks resolved. Not the source string the caller happened to type. For REMOTE libraries the filesystem path is a CACHE LOCATION rather than an identity, so those keep the provider-and-commitish source spec, which is what actually identifies them.
      Using the raw source string for local libraries was the first draft, and it fails four distinct ways, each verified against the resolver:
      (1) DUAL LOOKUP -- the local resolver maps a project path, that path plus gvp/, and that path plus .gvp/library/ onto the same library directory, so three different source strings name one library and would mint three entries per document.
      (2) TILDE -- tilde expansion happens in the CLI before resolution, but the source cache is keyed by the raw tilde-prefixed string, and ordinary path resolution does not expand it, so the expanded and unexpanded forms would be separate keys.
      (3) CONFIG SOURCE -- the root library's source defaults to a free-form configurable string rather than a path. Two unrelated projects that both set the same value would collide on one hash and silently overwrite each other's entry, each pointing at the other's absolute path. This is the most dangerous of the four because it corrupts rather than duplicates.
      (4) SYMLINKS -- two paths to one library are two keys.
      Every one of those failures is a property of the source STRING, and every one disappears once the key is the resolved path -- because resolving is precisely the step that collapses the dual lookup, expands the tilde, discards the configurable source value in favour of a real location, and (with symlinks resolved) unifies aliases. The resolved directory is itself a valid inherits source, so the paste-ability that motivates D49's grammar reuse survives intact.
      A related correction: the claim that the local resolver resolves relative paths against the REFERENCING library's directory is false at the system level. The resolver is instantiated once with the ROOT library directory and used for every source, including sources reached transitively through a fetched remote. The root library directory is what the recording function has, which makes this simpler rather than harder.
    tags:
      - framework
      - tooling
      - integrity
    maps_to:
      - gvp:G6
      - gvp:V10
      - gvp:D46
    origin:
      - date: '2026-09-03'
        note: Every one of the four failures was found by adversarial review of the first draft, which specified only "normalize to absolute" and would have shipped duplicate and colliding keys.

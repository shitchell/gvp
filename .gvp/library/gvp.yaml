  - id: R13
    name: An element's definitions are read from the element's own library
    statement: |
      Any lookup keyed to an element resolves that element's definitions from the element's own library. A library-wide question with no owning element keeps reading the flat merged view.

      This binds how every future check is written, unconditionally. Any new validation pass, exporter, query filter, or CLI check that resolves a definition-derived property OF A PARTICULAR ELEMENT -- `is_root`, `is_value_anchor`, `requires_decision`, `mapping_rules`, `id_prefix`, `field_schemas`, `display_label` -- resolves it through that element's source. Any check answering a question that has no owning element -- which categories a user may type at the CLI, which columns an export carries -- reads the merged view. Both views are legitimate; the defect is always using one where the other was meant, and it is the same defect every time. The line is drawn once, up front, for two reasons. The flat lookup is the shorter expression and therefore the one an author reaches for by default, so the wrong answer is the cheaper answer -- exactly the situation gvp:C1 says guidance has to pre-empt. And this is a library other libraries inherit, so the blast radius of getting it wrong scales with everything built on it (personal:P16): left as a per-pass judgement call it would be re-made, differently, by every author who adds a pass.

      IN A TRANSITIVE WALK, EACH NODE ANSWERS FOR ITSELF. "Keyed to an element" means the element the question is being asked OF, not the element the walk started from. This is what made the two Set-building loops in the traceability pass wrong: each resolved `is_root` / `is_value_anchor` once for the whole catalog and then applied that single verdict to every node reached in a transitive walk, when those are per-node questions. Freezing the starting element's view over a walk reintroduces the same defect one hop later -- one library's definitions governing another library's elements.

      THE IMPLICATION, STATED SO NOBODY REDISCOVERS IT AS A SURPRISE. The definitions visible to a library are its own layered over those of the libraries it inherits, transitively; descendants and siblings contribute nothing. A library that declares no category definitions of its own is therefore governed by its ancestors'. It follows that AN UPSTREAM LIBRARY CHANGING ITS CATEGORY DEFINITIONS RETROACTIVELY RE-JUDGES A DOWNSTREAM CONSUMER'S OWN ELEMENTS, for any consumer that declares none. Inheritance is pinned to an immutable tag or SHA, so the change arrives only when the consumer moves the pin -- but when it moves, the consumer's own elements are re-judged under definitions it did not write.

      The maintainer accepted that implication deliberately, verbatim: "i can dig the rationale and the implication. if i'm working in a company and upstream (i.e.: department level or org level) definitions change, i believe that *should* impact how my own project's elements are interpreted."

      That acceptance is what chooses definition reuse (gvp:G11) over consumer isolation. The rejected alternative -- an undeclared library falls back to the built-in defaults -- isolates a consumer completely, so nothing upstream can ever reinterpret its elements; it was rejected because it makes inheriting definitions a no-op unless every consumer re-declares them, which is the entire reason to put them upstream. gvp:D63 carries that alternative in full under `considered.defaults_for_undeclared_libraries`; it is not restated here.

      COMPLIANCE IS NOT CLAIMED. This rule is the line the code is measured against, not a report that the code meets it. gvp:D63 applied it to the traceability, semantic, and coverage passes; `structural-pass.ts` is NOT yet compliant -- four lines still read the flat registry (the E001/E005 schema lookups and the W009 id-prefix scan), and gvp:D63 names them as unaudited rather than cleared. The exporters and CLI commands are in the same position: some of their flat lookups are correct as library-wide questions, others are this defect in a different file, and no one has sorted them. Separate work covers that. Stating the gap here rather than implying a completeness the codebase does not have is what gvp:V2, gvp:V10, and personal:R1 ask for -- verify or do not claim -- and a documented guarantee that is unenforced is worse than an absent one, which is the failure gvp:D63 was written to end.

      IT ALSO DECIDES. Whether `cairn query --category <x>` matches an element against the merged category name or against its own library's name for that category (its own). Whether an exporter takes an element's column set and `display_label` from the merged registry or from the element's source (its source). Whether the W009 id-prefix scan compares an element's id against the merged `id_prefix` or the one its library declares (its library's). And, in the other direction, whether the set of categories `cairn add <category>` will accept is per-element -- it is not, because there is no element yet, so it reads the merged view.
    tags:
      - framework
      - integrity
      - tooling
    maps_to:
      - gvp:G5
      - gvp:G11
      - gvp:V2
      - gvp:V10
      - gvp:C1
      - gvp:R6
      - personal:P16
      - personal:R1
    origin:
      - date: '2026-09-25'
        note: |
          Issue #27, the guiding half of the same proposal whose runtime semantics are recorded as gvp:D63. Authored as a rule rather than folded into that decision because it binds how every future element-keyed check is written, unconditionally, and outlives the passes D63 changed.
          Maps to gvp:R6 because it is the same move one level up: R6 says code dispatches on the schema rather than on field names; this says the schema it dispatches on is the one the element's own library declares.
      - id: 21f4f3f7-424f-4b2f-affe-a6842fc11828
        date: '2026-09-26T00:13:10.824Z'

  - id: D65
    name: The library-scoped registry opt-out is read at the write site, and both spellings are scoped there
    rationale: |
      A library can now say `meta.registry.enabled: false` about itself and stay out of the machine-wide registry however cairn is pointed at it -- `--store`, `--library`, or discovery from the current directory. It is the third spelling D43's amendment admits, and it delegates: `src/registry/record.ts` reduces it to the one `registry.enabled` switch and applies the same `!== false` gate `src/cli/helpers.ts` applies to the invocation's config. Nothing about recording suppression is reimplemented, which is the whole licence for a third spelling under P19 and the reason P11 stays satisfied rather than overridden.

      WHERE IT IS READ IS THE DESIGN. The gate lives inside `record(dir, source)`, per library, not at the invocation gate in `src/cli/helpers.ts`. That placement is the entirety of D60: a declaration suppresses the DECLARING library's entries and reaches nothing else, so an inherited library can no longer switch off its consumer's registry. It also answers the other half of #25 -- recording depending on how the library was addressed -- for free rather than by enumeration, because every addressing path arrives at that one function.

      BOTH SPELLINGS ARE SCOPED, NOT JUST THE NEW ONE. `meta.config_overrides.registry` already worked before this change and was simply undocumented; it was also the path D60 measured its hazard on. Scoping only the new spelling was rejected for two reasons. First, it would leave D60 stated but unimplemented for the very mechanism it was measured against -- the decision names `src/catalog/catalog.ts` as the unfixed site. Second, and worse, it would give one mechanism two scopes depending on how it was spelled, when P19's licence rests on a spelling inheriting every guarantee and precedence rule of the thing it delegates to. Two spellings that disagree about whose registry they govern are two mechanisms wearing one name.

      So `registry` joins `user` as a config key that a document-declared override does not apply to the loading invocation (`src/catalog/catalog.ts`), for a different reason: `user` is excluded because identity is personal, `registry` because its effect is a WRITE that lands in the consumer's environment. The override is not discarded -- `record.ts` reads it library-scoped, alongside the named spelling, through one function. A config LAYER setting `registry.enabled: false` still gates the whole invocation, exactly as D43 says.

      MEASURED, BEFORE AND AFTER. Fixture: a consumer project inheriting an upstream library that declares the opt-out. Before: with `config_overrides`, total entries 0 -- the consumer's own two documents destroyed along with the upstream one; with `meta.registry.enabled`, 2 entries, the key silently ignored. After: 1 entry in both cases, the consumer's own, upstream suppressed. The same fixture across `--store`, `--library` and cwd discovery gives 0 entries for the declaring library on every path and both spellings.

      THREE SMALLER CALLS, EACH DELIBERATE. (1) Any one document opting out opts out the whole library, and a sibling's `enabled: true` does not overturn it -- library-wide for the same reason `collectLibraryCategories` is, since a base document commonly carries the library's metadata while siblings carry its elements, and a per-document reading would record the siblings of the document that opted out. The quieter answer wins, matching the `!== false` gate where only an explicit opt-out skips. (2) `enabled: true` grants nothing: when the invocation's config or `--no-registry` has turned recording off, this code is never reached, so a library cannot acquire a write on its consumer's machine -- the authority D60 denies it. (3) Only LIBRARY entries are suppressed, not the project keyspace (D22, `by-id`). D60 scopes a library's declaration to "that library's own records", and a project entry is a record of the project; suppressing it would also misfire under `--library <someone else's library>`, where the library that opted out is not the invoking project's at all, which is the shape of over-reach D60 exists to forbid.

      W019 UNRECOGNIZED_META_KEY, AND HOW BROAD IT IS. R12 required the diagnostic; the open question was breadth. It fires on EVERY unrecognized `meta` key, not only on members of a recognized namespace like `meta.registry.*`. R12 names "`meta` and its sub-keys" as containers in their own right, and the narrow reading would have left the plain misspelling -- `meta.registery:` -- silent, which is the same no-op failure one letter away and the one a user is most likely to hit. The cost is that a forward-compatibility key riding on `meta`'s passthrough now warns; R12 already answers that, and the answer is `suppress_diagnostics: [W019]` under D7 -- an explicit escape hatch rather than silence. It is a warning, not an error, per H8: an unrecognized `meta` key is inert by definition. It names the key and stops (P14).

      `meta` STAYS PASSTHROUGH. personal:V5 forbids filtering unknown fields, and `meta.library_id` is read through passthrough today (R9 / #16), so a strict schema would break the registry. Preserve AND warn -- both, not either, which is R12's point: preserving without warning trades a data-loss failure for a no-op failure, in which the user's key survives, means nothing, and nothing says so. `library_id` is now DECLARED in the schema for the same reason `registry` is: a key cairn actually reads must not be reported as unrecognized.

      SUB-NAMESPACE CHECKING IS LIMITED TO CLOSED MEMBERSHIP. `registry` is the only `meta` sub-namespace whose members are a fixed, enumerable set. `defaults` is keyed by field names, `definitions.tags` by tag names, `config_overrides` by config keys -- all open by construction, with no unknown member to detect. Extending W019 into them would fire on correct documents.

      DOCUMENTED, WHICH IS WHY #25 WAS FILED AT ALL. Neither `config_overrides` nor `registry` appeared in the schema reference's `meta` table, so the reporter reached for a key that did not work. Both are listed now, with sections for each; `registry`'s section states the scope alongside the spelling, and `tests/registry/docs.test.ts` holds the README to both.

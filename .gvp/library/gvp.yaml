  - id: D40
    name: Record every resolved library in a machine-global index
    rationale: |
      Cairn resolves libraries constantly -- local .gvp/ directories and remote sources named in inherits -- but records nothing, so each library is visible only from inside the project that references it. Every catalog-building invocation now records what it resolved into a machine-global index, making the answer to "which GVP libraries exist on this machine, and which has this project seen" a lookup rather than a thing a human must remember to mention.
      A filesystem scan of configured roots was considered and rejected. "Configured roots" requires the user to have configured them correctly, which is the same "depends on a human remembering to set it up" failure the feature exists to remove. A scan also cannot see libraries outside the scanned roots, cannot surface a remote never fetched, and cannot distinguish a live project from a build sandbox or a skel/ template. Recording what cairn actually resolved needs no configuration, sees what was really used, and excludes directories cairn was never run against.

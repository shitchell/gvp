  - id: D48
    name: Name, project_id, and library_id are correlation fields, not keys
    rationale: |
      These fields collapse "the same logical library seen in different locations" when present, and degrade gracefully when absent, precisely because nothing depends on them for identity. project_id reuses D21's existing identity rather than minting a second one. library_id is read from meta.library_id, which already survives parsing today because documentMetaSchema permits unknown keys -- so the forward-compatibility claim for issue #16 is verifiable now rather than aspirational.

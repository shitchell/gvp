    disposition: accepted
    rationale: |
      Element references resolve by the library short address `[<alias>:]<meta.name>:<id>`, not by file path. meta.name is the stable document identity (DEC-1.5/D15), so references survive file reorganization — the path-based DEC-6.4 form did not, inverting the stated design (the #11 bug: path resolved, meta.name did not, and the `as:` alias was inert). The alias selects the library (source); absent, resolution spans all libraries preferring the local one, and a bare name matching multiple libraries is reported ambiguous (qualify with the alias). Path-based short refs are dropped (breaking, acceptable in alpha); canonical `source:documentPath:id` remains the absolute escape hatch. All nine ad-hoc resolvers were centralized onto Catalog.resolveRef (P11), which also fixed `inspect`. Depends on document-name uniqueness (gvp:R8). This amends DEC-6.4/DEC-1.1c (2-segment short form: path → meta.name).

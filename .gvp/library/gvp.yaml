  - id: D67
    name: A test builds the repository it reads; it never reads the one it lives in
    disposition: accepted
    rationale: |
      A test whose input is the host repository's git history is not a test of the code. `tests/refs/git-diff-tracer.test.ts` read the live repo -- `git log --oneline -20`, `HEAD~1..HEAD`, and "find the commit whose subject mentions X" -- so its runtime and its assertions were both functions of what had last been merged. It timed out the first time HEAD was a 59-file, ~9k-insertion merge (27s against a 20s limit, #20), and the response was a timeout bump: first the suite-wide default to 20s, then `3ba6ba3` ("test: give the git-diff tracer headroom for a large HEAD commit") raising that one test to 120s. Both bumps left the defect intact. A suite whose greenness is a function of git history reports the history, not the code, and the next large merge re-breaks it.

      THE WORSE HALF OF THE DEFECT WAS NOT THE TIMEOUT. The file's commit hunts (`msg.includes('TypeScript parser')`, `msg.includes('add refs to GVP')`) both targeted a3cbe2e, which is now 194 commits back and long outside the 20-commit window. Both hunts therefore found nothing, and three of the five tests took their `if (!parserFixCommit) return` / `if (!refCommit) return` exit and asserted nothing while reporting green -- measured at 2ms, 2782ms (all of it spent on the twenty `git log` spawns before returning) and 49ms. Of the two that still ran, one asserted `expect(result).toBeDefined()`, which no implementation can fail. So a file advertising five passing tests of DEC-10.2 was in fact asserting two substring matches and two non-null checks. Those guards were not defensive: they were the test recognising it could not rely on its environment and choosing silence over failure, which is the exact posture gvp:V3 refuses. A fixture removes the condition the guards were guarding against, so they are gone rather than corrected.

      WHAT SHIPS. `buildFixtureRepo()` creates a repository in a tmpdir with five commits whose content the test wrote: a base commit; a commit that reworks `add()` while leaving its file-mate `subtract()` byte-identical; a commit that removes `subtract()` and introduces `multiply()`; a commit touching only an unref'd file; and a commit changing a markdown heading block, a `.txt` file with no registered parser, and the library document itself. Named indices (`BASE`, `ADD_MODIFIED`, ...) address positions in that sequence. Every assertion is now specific -- exact `changedFiles` arrays, exact `refChanges` lengths, `changeType` per identifier, `blockBefore`/`blockAfter` content, and the `[~]`/`[+]`/`[-]` markers and `Traces to:` walk of `formatDiffTrace`. Coverage is strictly larger than before, not equal: the identifier-level `added` and `removed` paths, the parserless whole-file fallback (DEC-10.15), heading-block scoping, and the "no traced changes" output were all unreachable from live history and are now pinned.

      ONE LIVE-REPO TEST IS KEPT, AND WHY IT IS NOT THE SAME COUPLING. `traceGitDiff(realCatalog, 'HEAD', 'HEAD', WORKTREE_ROOT)` runs against this repository and its actual `.gvp/library`. An empty range is empty whatever HEAD is, so the cost is one `git diff` and no content reads -- constant regardless of history size -- while still proving the tracer composes with the real library's shape rather than only with a three-decision fixture. That is the distinction the fix turns on: depending on git being present and correct is fine; depending on what was committed to this repo is not.

      RUNTIME IS SPAWN-BOUND, WHICH CHANGES WHERE THE COST LIVES. `traceGitDiff` shells out once for the diff and twice per matching ref, and on a machine with a git wrapper ahead of git on PATH each spawn measured ~180ms against ~1ms for the binary. So the file's runtime tracks spawn COUNT, and two measures matter. Fixture construction uses `-c user.email=... -c user.name=...` on the commit rather than three `git config` calls, and one `rev-list --reverse` rather than a `rev-parse` per commit. Traces are memoized per commit pair -- a Catalog is immutable after construction and a `DiffTraceResult` is only ever read, so sharing both across tests is safe, and the eight fixture tests cost four distinct traces. Measured on this machine: isolated 20.29s to 10.86s, and the worst single test from 11116ms to 1504ms isolated / 3359ms under full-suite parallel load against a 20s limit. The 120s override on the old test is deleted; nothing in the file now needs a per-test timeout, which is the real signal that the coupling is gone.

      CLEANUP IS PART OF THE FIXTURE, NOT AN ADDENDUM. `afterAll` removes the root with the `maxRetries: 5, retryDelay: 50` form `tests/setup.ts` already uses, and writes the failure to stderr rather than swallowing it. #19 records 838 leaked `/tmp` directories from suites that build git repos and never remove them; a fix for #20 that added a 12th leak per run would trade one defect for another. Verified: four consecutive full-suite runs left zero `cairn-tracerfix-*` directories.

      ALSO IN SCOPE, ONE LINE OF PRODUCTION CODE. `getChangedFiles` now passes `stdio: ['pipe','pipe','pipe']`, as its sibling `getFileAtCommit` already did. Without it an unresolvable range printed git's "fatal: ambiguous argument" onto the caller's console while the function returned an empty result -- noise on a path that is handled, both in the suite and in `cairn`'s own output.

      ACCEPTED COSTS, RECORDED RATHER THAN GLOSSED (gvp:V3). The fixture library is a second, smaller GVP document that must stay parseable as the schema evolves, which is a real charge against personal:V3; it is accepted because a shared fixture library would couple this file to every other suite's needs, and the document is deliberately three decisions wide. Memoization means a test mutating a result would corrupt its neighbours -- guarded by a comment and by the type being read-only in practice, not by the language. And the tracer is no longer exercised against a several-hundred-commit history; judged acceptable because git does the history walking and the tracer only consumes `--name-only` output, so a large history exercises git's performance rather than this module's behaviour.
    tags:
      - tooling
      - integrity
      - code
    maps_to:
      - personal:G1
      - gvp:V3
      - gvp:V10
      - personal:V2
      - code-testing:TP2
      - code-common:CP13
      - code-common:CP3
    considered:
      raise_the_timeout_again:
        description: Bump the per-test timeout a second time, from 120s to whatever the newest large merge needs.
        rationale: |
          The cheapest possible change -- one number, no new code, and it would have made the suite green within the minute. Rejected because it had already been tried twice (the 20s suite default, then `3ba6ba3`'s 120s on this test) and both times the failure returned on the next large commit, which is the definition of a fix that does not address the cause. It also leaves the far worse half of the defect entirely untouched: three tests would continue to report green while asserting nothing, and no timeout value can detect that. The end state of this path is a test that takes minutes, verifies nothing, and still cannot be trusted.
        would_have_served:
          - gvp:V4
          - personal:V1
        conflicts_with:
          - gvp:V10
          - gvp:V3
      pin_the_test_to_fixed_shas_in_this_repository:
        description: Replace the commit hunts with hard-coded SHAs from this repo's history, so the ranges stop moving.
        rationale: |
          Genuinely fixes the nondeterminism the commit hunts caused -- a pinned SHA cannot scroll out of a window, so the silent `return` guards could go and the assertions could be made specific against known content. Rejected because it buys determinism with portability: a pinned SHA is absent in a shallow clone, in a fresh fork, and after any history rewrite, so the test becomes unrunnable outside this exact clone and the guards would have to come back to cope. The runtime problem also survives, since a pinned commit's cost is still that commit's size, and this repo's largest commits are the ones a tracer test most wants to touch. Content the test wrote is the only input that is both known and available everywhere.
        would_have_served:
          - gvp:V3
        conflicts_with:
          - gvp:V10
          - gvp:G6
      stub_git_and_drive_the_tracer_against_a_fake:
        description: Inject or mock the command runner so no subprocess is spawned and the diff output is supplied by the test.
        rationale: |
          By far the fastest -- milliseconds, no tmpdir, no cleanup, and #19's leak class cannot arise at all. It also has a legitimate design argument behind it, since a seam for the command runner would make the module testable without any process at all (code-common:CP13). Rejected for this module specifically: `traceGitDiff` is almost entirely an adapter over real git's behaviour -- `--name-only` path spelling, `git show <rev>:<path>` failing for a file absent at that commit, which the code reads as "added"/"removed". A stub would assert the test author's model of git, and every interesting bug here lives in the gap between that model and git. Building the repository keeps real git in the loop for a cost that is bounded by the fixture rather than by history.
        would_have_served:
          - personal:V1
          - gvp:V4
        conflicts_with:
          - gvp:V10
      drop_live_repository_coverage_entirely:
        description: Make the file purely synthetic, with no test that touches this repository or its real library.
        rationale: |
          The most internally consistent reading of the rule this decision states, and it would have removed the last line of the file that mentions `WORKTREE_ROOT`. Rejected as slightly too strict: the real `.gvp/library` is hundreds of elements across inherited sources, and a fixture of three decisions cannot show that catalog construction and ref lookup still compose at that scale. The kept `HEAD..HEAD` test buys that for one constant-time `git diff`, and it is history-INDEPENDENT rather than merely history-cheap, so it does not reintroduce what #20 reported. The rule is about reading history, not about never touching the repo.
        would_have_served:
          - gvp:V10
          - personal:V1
        conflicts_with:
          - code-testing:TP1
    refs:
      - file: tests/refs/git-diff-tracer.test.ts
        identifier: buildFixtureRepo
        role: implements
      - file: tests/refs/git-diff-tracer.test.ts
        identifier: trace
        role: implements
      - file: src/refs/git-diff-tracer.ts
        identifier: getChangedFiles
        role: implements
    origin:
      - date: '2026-09-25'
        note: 'Issue #20 (git-diff-tracer test is coupled to live repo history; times out after a large merge), which diagnosed the coupling and proposed the synthetic repo. Issue #19 (838 leaked /tmp directories from git-backed suites) is adjacent and shaped the teardown, but is NOT fixed here -- the source-resolver suites it names still leak ~20 directories per full run.'
      - id: e0b88bca-ecf7-4b07-90e1-c7bd9dacbb49
        date: '2026-09-25T23:39:44.857Z'
        note: Imported from tracer-fixture-patch.yaml
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
  - id: D68
    name: The structural pass shares the reference walker and resolves every definition per library
    disposition: accepted
    rationale: |
      Two defects in one file, left by two earlier agents for the same reason — a different parallel agent held write intent over `structural-pass.ts` — and fixed together because they touch overlapping lines. gvp:P20 has since made that arrangement the exception rather than the default; this is the cleanup its absence cost.

      DEFECT 1: THE PASS KEPT ITS OWN REFERENCE WALKER. #22 was the importer walking `list<model>` containers but not `dict<model>`, so pseudo-ids inside `decision.considered.*.would_have_served` / `conflicts_with` were written to disk unresolved. The fix introduced `collectReferenceSites(data, fieldSchemas)` and moved the importer onto it, but `structural-pass.ts` went on maintaining a second, hand-rolled walk of the same shapes. That reduces the divergence which CAUSED #22 to one adoption site instead of eliminating it: the next new container shape desynchronises the validator from the importer again, and the failure mode is the asymmetric one — the importer writes a reference the validator then reports, or worse, does not. The pass now calls the shared walker. `declaredReferencePaths` plus the per-category test in `tests/schema/reference-sites.test.ts` stay as the compensating guard, and they get stronger for it: a container shape the walker does not understand now fails one test rather than diverging two consumers silently.

      THE E001 MESSAGES AND `details` KEYS DID NOT CHANGE, AND THAT WAS VERIFIED RATHER THAN TRUSTED. `reference-sites.ts` claims in its own comments that its `location` and `detailsKey` were phrased to match this pass's existing messages. Checked field by field: `maps_to` carries no `details` key in either; a top-level `list<reference>` uses the field name for both; a contained model uses `${container}.${sub} ('${label}')` and `${container}:${label}`; and the `list<model>` item label falls back id -> name -> 1-based index identically. Emission order is also preserved — `maps_to` first, then `Object.entries` over the same spread of `allFieldSchemas` layered with the category's own. Two behaviours differ only where nothing observable rides on them: the walker skips a `maps_to` entry in `field_schemas` (which `checkReservedFieldCollision` already forbids) so it can never be double-reported, and the old `if (catDef)` gate is gone, which keeps the reserved `maps_to` and the library-global `_all` schemas reachable for an element whose own library does not define its category — a state only per-library resolution can produce.

      DEFECT 2: FLAT REGISTRY WHERE gvp:R13 REQUIRES THE ELEMENT'S OWN LIBRARY. gvp:D63 fixed nine element-keyed lookups in the traceability, semantic, and coverage passes and named this file as unaudited rather than cleared; gvp:R13's COMPLIANCE IS NOT CLAIMED section names it too, citing four lines. The audit found six definition lookups, not four. The two the four-line list missed are the `catalog.registry.allFieldSchemas` reads that sit beside the E001 and E005 category lookups: which fields an element even HAS is as much a per-element definitional question as what its category means, and reading the merged view there would have left half of each lookup wrong. All six are element-keyed and all six moved: E001's category definition and field schemas, E005's, and both W009 id-prefix reads.

      NO LOOKUP IN THIS PASS IS LIBRARY-WIDE, AND THAT IS WORTH STATING RATHER THAN INFERRING. gvp:R13 makes the split the design — "a library-wide question with no owning element keeps reading the flat merged view" — so the absence of a survivor is a finding, not an oversight. Every diagnostic this pass emits is about a specific element (E001, E002, E005, W007) or about one document's own elements (W009, W008, W016, W019, E003, E006), and a document belongs to exactly one library. The pass's other lookups were already correctly per-library before this change and were left alone: W007 groups tag definitions by `doc.source`, and W008 groups category definitions the same way.

      W009 NOW CARRIES THE PREFIX ON THE GROUP INSTEAD OF LOOKING IT UP TWICE. The scan resolved `id_prefix` once per element to match ids, then AGAIN by category name to format the gap message. The second lookup has no owning element to resolve through, so per gvp:R13 it has no correct flat-or-scoped answer — it is the shape the defect takes. The prefix each group was matched under is now recorded alongside the group and reused, which removes the second lookup rather than re-pointing it.

      WHY THIS IS A NO-OP ON THIS REPOSITORY, AND WHY IT SHIPPED ANYWAY. No library in play declares `meta.definitions.categories` — not this repo's, not the six documents in gvp-docs@v0.7.0 — so every source resolves to `src/data/defaults.yaml` verbatim and the flat lookup returned the right answer by accident. `cairn validate` output is byte-identical before and after, in emission order and with `--include-inherited`, verified by stashing `src/`, rebuilding, and diffing. That is the same latent-not-benign situation gvp:D63 shipped against. Seven fixtures added to `tests/validation/per-source-definitions.test.ts` are the whole safety net: multi-library catalogs where an ancestor and a descendant declare different `field_schemas` and different `id_prefix`, ordered so the flat registry answers wrongly. All seven fail against the unfixed pass and cover both directions gvp:D63 names — a tightening descendant inventing violations an ancestor was never authored against, and a loosening one silently stopping enforcement, which reports nothing at all.

      ONE ADJACENT GAP FOUND AND DELIBERATELY NOT FIXED. `meta.definitions._all.field_schemas` (DEC-2.8) is unreachable for user documents: `definitionsSchema` in `src/model/document-meta.ts` declares only `tags` and `categories` and is a plain zod object, so zod strips `_all` before the merger looks for it. `allFieldSchemas` is therefore always exactly the built-in `_all`, identical for every source, which is why moving those two reads to the per-source registry cannot change an answer today. Making them per-source is still what gvp:R13 requires, and it is what makes the fix correct the day `_all` starts working. Recorded here rather than fixed because it is a separate defect with a separate blast radius, and gvp:P20 asks for one change in flight.
    tags:
      - framework
      - integrity
      - tooling
    maps_to:
      - gvp:R13
      - gvp:R6
      - gvp:G5
      - gvp:V2
      - gvp:V10
      - gvp:P20
    considered:
      fix_only_the_registry_defect:
        description: Apply gvp:R13 to the six lookups and leave the pass's own hand-rolled reference walker in place.
        rationale: |
          Rejected. It is the narrower diff and it is what a literal reading of the second defect asks for. But the two defects sit on overlapping lines — the E001 category lookup is the first line of the block the walker replaces — so shipping them separately means writing the same region twice and reviewing it twice. More importantly it would leave #22's actual root cause, two consumers each maintaining a walker over the same schemas, intact and one adoption site from recurring under a different field name.
        would_have_served:
          - personal:V1
        conflicts_with:
          - gvp:V10
      pass_the_catalog_into_the_walker:
        description: Have `collectReferenceSites` take a Catalog and an Element and resolve the field schemas itself, so no caller can pick the wrong registry.
        rationale: |
          Rejected. It would make the gvp:R13 mistake unrepresentable at this call site, which is a real attraction. But it couples a pure schema-derived walker to the catalog, and the importer's caller has no Element at all — it walks a patch record before any element exists — so the signature would have to admit both shapes and the walker would end up branching on which world it is in. Keeping it `(data, fieldSchemas)` is what lets the importer and the validator share it in the first place.
        would_have_served:
          - gvp:V10
        conflicts_with:
          - gvp:R6
      keep_the_second_w009_lookup_scoped_by_document_source:
        description: Leave W009's second, name-keyed registry lookup in place and point it at `getRegistryForSource(doc.source)`.
        rationale: |
          Rejected. It gives the right answer — every element in a document shares that document's source — and it is a one-word change. But it keeps a definition lookup that is keyed by a category NAME with no owning element to resolve through, which is precisely the shape gvp:R13 says has no correct answer, sitting two lines from the element-keyed one that does. Carrying the prefix on the group deletes the question instead of answering it, and a future reader cannot reintroduce the flat view at a call site that no longer exists.
        would_have_served:
          - personal:V1
        conflicts_with:
          - gvp:R13
    origin:
      - id: c8f7092c-9c16-4b87-8f7b-75e0fca95719
        date: '2026-09-26T01:12:51.298Z'
        note: Imported from d68-structural-pass.yaml
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
  - id: D69
    name: The shipped command reference is generated from `--help` and gated by a drift test
    disposition: accepted
    rationale: |
      `skills/cairn/commands-reference.md` is rebuilt from `cairn <command> --help` for every
      command the CLI exposes, and `tests/cli/commands-reference-drift.test.ts` fails the build
      whenever the document and the binary disagree -- in either direction. It catches an
      undocumented flag, a documented flag that does not exist, a command with no section at all,
      and a flag the document claims is absent that the CLI has since grown. Each failure names
      the specific flag and the specific command.

      The file had drifted twice, and both drifts shipped to agents. This change folds in an
      external measurement report, `CAIRN-SKILL-DELTA-2026-09-25`, produced by an independent
      agent on a machine with heavy GVP use; it froze both skill copies, diffed them, and probed
      the real binary in a scratch HOME with a cwd outside the user's home directory. Its verdict,
      verbatim: "Upstream's `commands-reference.md` is the weakest file in the package. Its own
      sync commit said so: *'commands-reference.md (live copy is larger but pins a stale `beta`
      install channel)... NOT synced here'* (gvp `feacb475`). Three of its lines are wrong against
      the 5.0.0 binary's own `--help`, and it omits flags that 5.0.0 has."

      Confirmed against this build before acting: `cairn review` has no `--approve` (the document
      advertised one, as did `workflow-full.md`); `export --format` is `json, csv, markdown,
      compact` with no `dot`; and `-d/--document`, `edit --field-file`, `inspect --hops`,
      `validate --include-inherited/--inherited`, `add --no-provenance`, the `import` section and
      the whole `mv` command were documented nowhere.

      Prose review does not close this. The two artifacts are only compared when somebody happens
      to look, and the report's recommendation is the one adopted here: "A mechanical check (a test
      that diffs documented flags against `--help`) would stop this file drifting a third time.
      That is personal:P7: a process needs an enforcement mechanism."

      Why the stakes are higher than for ordinary documentation: agents read the skill, not
      `--help`. A wrong flag table does not produce a confused human who then checks the binary --
      it produces a failed tool call inside an agent loop, which is precisely the failure the
      shipped skill exists to prevent (gvp:G7).

      Credit where it is due: the delta report is someone else's measurement work, and the
      corrections folded in alongside this one are its findings, not ours -- the library-registry
      discovery rules and the four non-equivalent opt-outs (SKILL.md), the `-f` list-field trap
      (#23, re-reproduced here), the direct-`maps_to` mapping-rule trap (schema-reference.md,
      re-measured here: `D2 -> D1 -> {G1,V1}` emits W003), `--store`/`--library` targeting, and
      the hand-editing step in `workflow-full.md` that contradicted SKILL.md's own Key Principle
      3. One of its claims was checked and rejected as stale: that element references must use the
      documentPath rather than `meta.name`. `meta.name` resolution has worked since 2.0.0 and both
      forms resolve today, so that section was deliberately not folded in.
    tags:
      - documentation
      - tooling
      - integrity
    maps_to:
      - gvp:G7
      - gvp:V10
      - gvp:V6
      - personal:P7
      - code-common:CP10
    considered:
      keep-reviewing-the-file-by-hand:
        description: Leave the reference as prose and rely on maintainers noticing skew.
        rationale: This is what had been happening, and it produced two drifts that shipped. A convention is a suggestion; a hook is a guarantee (code-common:CP10). Rejected on evidence, not on principle.
        conflicts_with:
          - gvp:V10
      generate-the-whole-file-from-help:
        description: Emit commands-reference.md mechanically from `--help` at build time.
        rationale: Drift-proof by construction, and tempting. Rejected because the value of this file is the part `--help` cannot carry -- that list fields must be strict JSON, that `--library` bypasses config-level registry opt-outs, that there is no `--approve` and what to do instead. Generating the file would delete exactly the part worth keeping and leave a prettier `--help`.
        would_have_served:
          - gvp:V10
        conflicts_with:
          - gvp:V6
      check-one-direction-only:
        description: Assert only that every documented flag exists, not that every flag is documented.
        rationale: 'Half the cost, and it would have caught `--approve`. It would not have caught `--hops`, `--field-file`, `-d/--document` or `mv`, which are the larger share of the measured gap: those are flags that shipped and were never written down. Both directions cost the same to implement once the help output is parsed.'
        would_have_served:
          - personal:V1
        conflicts_with:
          - gvp:V10
    refs:
      - file: tests/cli/commands-reference-drift.test.ts
        identifier: parseOptions
        role: implements
      - file: skills/cairn/commands-reference.md
        identifier: Flags this document asserts do not exist
        role: defines
    origin:
      - id: 3bf4893e-8c07-4e2c-8035-83d8d89dc9c9
        date: '2026-09-26T01:57:13.336Z'
        note: Imported from d69-skill-drift-gate.yaml
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
constraints:
  - id: C1
    name: Agents optimize for minimal effort
    impact: |
      Humans and AI alike tend toward the path of least resistance. Any friction the framework introduces must justify its cost against this tendency.
    tags:
      - framework
      - usability
    maps_to: []
  - id: C2
    name: Cairn invocations can run concurrently against shared state
    impact: |
      Parallel agent sessions are a normal mode of use, not an edge case, and they frequently run in the SAME project rather than in different ones. Any machine-global state cairn maintains will be written by several invocations at once, so shared-write designs must be correct under concurrency rather than assuming serialized access.
    tags:
      - framework
      - tooling
      - integrity
    maps_to: []
procedures:
  - id: S1
    name: Under parallel work, subagents contribute library patches and one orchestrator imports them
    description: |
      When parallel work has been invoked, a worktree subagent never writes to `.gvp/library/`. It authors its GVP contribution as a patch file using pseudo-ids, commits only that file, and an orchestrator imports the pending patches one at a time on the integration branch. Real ids are therefore assigned at one point, by one assigner, against one base -- so an id collision is impossible rather than unlikely.

      The maintainer's instruction, verbatim: "if we do find some pressing need for parallel work, to establish (also codified in GVP using the Procedure element) a protocol for worktree subagents only ever contributing patches that an orchestrator will import before merging into main"

      gvp:P20 governs WHETHER to work in parallel and leaves that to the owner's judgement. This procedure governs HOW, and admits no judgement at all once parallel work has been chosen. The asymmetry is deliberate: the discretionary exception lives in exactly one place -- the owner's decision to go parallel -- and nothing downstream of it is discretionary. A worker cannot reason its way out of the patch protocol on the grounds that its change looks small.

      Why it works, rather than merely reducing the odds: pseudo-ids (`?d_my_decision`) defer id assignment to import time, and importing serially into one branch means every import sees every prior import. This is gvp:P18's shape applied to process instead of to storage -- arrange the work so that contention cannot produce a wrong answer, rather than permitting the contention and then coordinating it. A correctness argument resting on the shape of the work has no failure mode to get wrong.

      It also removes the hazard that nearly shipped in #32. Two workers writing separate patch FILES never conflict in the library at all, so git is never asked to merge two competing element bodies and cannot hoist a shared `- id:` line above the conflict markers.
    when: |
      Parallel work has been invoked under gvp:P20 -- two or more workers holding write intent over the same GVP library at the same time, typically separate worktrees under an orchestrator. Under the serial default this procedure is inert: a single worker may edit the library directly through `cairn add` / `cairn edit` / `cairn import`.
    steps:
      - id: S1.1
        name: Author the contribution as a patch, never as a library edit
        description: |
          Write `.gvp/patches/pending/<issue-or-topic>.yaml` and put every new element in it with a pseudo-id. Prefix the pseudo-id slug with your issue or topic (`?d_i32_serial_work`) so two workers' patches cannot collide on a pseudo-id either. Reference upstream elements by their real library ids as normal. Do not run `cairn add` or `cairn edit` against the library on a worktree branch: both assign a real id against your own base, which is precisely the coordination the orchestrator exists to supply.
        example: |
          # .gvp/patches/pending/i32-serial-work.yaml
          decisions:
            - id: "?d_i32_serial_work"
              name: ...
              maps_to: [gvp:G5, gvp:V2]
      - id: S1.2
        name: Verify by importing locally, then revert
        description: |
          A worker that only emits a patch has no feedback loop -- you cannot `cairn validate` an element you have not applied. Apply it temporarily instead: `--dry-run` first and read every id assignment and reference rewrite, then apply, then validate, then discard the applied copy with `git checkout --`. Treat the ids you saw as throwaway: they were assigned against your base and will differ when the orchestrator imports into the integration branch. Nothing downstream of the patch may depend on them.
        example: |
          cairn import .gvp/patches/pending/i32-serial-work.yaml --into gvp --dry-run
          cairn import .gvp/patches/pending/i32-serial-work.yaml --into gvp --yes
          cairn validate
          git checkout -- .gvp/library/
      - id: S1.3
        name: Commit the patch file only
        description: |
          The branch's diff contains your code and `.gvp/patches/pending/<file>.yaml`, and no change under `.gvp/library/`. This is the step that is checkable by inspection and is therefore the enforcement point: a library hunk in a worker's diff means the procedure was bypassed, and it is converted back into a patch before review rather than merged and renumbered afterwards.
      - id: S1.4
        name: The orchestrator imports on the integration branch, one file at a time
        description: |
          After the worker branches have merged, the orchestrator imports each pending patch in a fixed order, previewing with `--dry-run` before applying. Import files INDIVIDUALLY rather than pointing `cairn import` at the directory: pseudo-ids must be unique per category within a patch set, and one file per set keeps two workers' pseudo-ids from ever sharing a set. An import that UPDATES an existing element -- as against adding one -- must carry `update_rationale` on that element or the import writes nothing.
        example: |
          for f in .gvp/patches/pending/*.yaml; do
            cairn import "$f" --into gvp --dry-run && cairn import "$f" --into gvp --yes
          done
      - id: S1.5
        name: Validate once, then delete the imported patches
        description: |
          Validate after the last import, not after each one: the library is only coherent once every patch is in, and a patch whose `maps_to` points at an element another patch adds will fail until both have landed. Then `git rm` each imported patch. A clean tree has an empty `pending/`, so a non-empty `pending/` on the integration branch is itself the signal that a merge landed without its library contribution -- and the deleted files stay in history as the record of what each worker proposed.
    related:
      - gvp:P18
      - gvp:R1
    tags:
      - integrity
      - tooling
    maps_to:
      - gvp:P20
      - gvp:G5
      - gvp:V2
      - gvp:V9
      - gvp:V10
      - gvp:C2
      - personal:P7
      - ai-common:P1
    origin:
      - date: '2026-09-25'
        note: |
          Issue #32, the second of the two guiding elements it asks for, and the first procedure element in this library. Two details were settled here rather than left to each agent to rediscover: that a patch-only worker verifies by importing locally and reverting (observed as working practice during #32), and that pending patches live at `.gvp/patches/pending/<issue-or-topic>.yaml`, tracked on the worker's branch and `git rm`'d by the orchestrator after import. No patch files were tracked in this repository before, so the location is a convention chosen here, not a pre-existing one.
          personal:P7 is why the procedure names a checkable enforcement point (step 3: a library hunk in a worker's diff) rather than relying on each worker remembering the protocol.
      - id: 025b4f1d-8b6d-4734-acfe-cf22018b166e
        date: '2026-09-26T00:13:10.824Z'
        note: Imported from i32-serial-work-and-definition-resolution.yaml
        by:
          name: shaun mitchell
          email: shaun@shitchell.com

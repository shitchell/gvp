  - id: D12
    name: Three input modes (CLI flags, interactive, editor)
    rationale: |
      The add and edit commands support CLI flags (for scripts and AI), interactive prompts (for guided input), and $EDITOR (for complex edits). This meets different users and workflows without forcing a single interaction style.

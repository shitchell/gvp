  - id: D17
    name: '--hops <n> bounds maps_to expansion for readable inline rendering'
    rationale: |
      The existing `cairn inspect` text output shows `maps_to` as bare IDs, and `--trace` walks the full ancestor DAG. Neither is ideal for rendering a guide with meaningful context: bare IDs force the reader to cross-reference the library to understand what each mapping means, and a full trace drowns the element being inspected in transitive ancestors that rarely matter at the point of reading. `--hops <n>` is a bounded middle ground: `--hops 1` expands the element's direct maps_to inline with the parent's id, name, category, and a truncated preview of its primary field; `--hops 2` recurses one more level; etc. This keeps the reader's context window focused on the hops that matter while still linking each mapping to enough content that it is self-explanatory. The renderer reads `primary_field` from the category registry and does not branch on `element.categoryName`, so the same expansion shape works for goals, values, principles, rules, heuristics, decisions, and any future category -- consistent with P15 (dogfood your own abstractions) and R4 (core stays domain-agnostic). The hop count is an integer, bounded by natural graph depth; cycles are broken by a seen-set keyed on element hashKey.
    tags:
      - tooling
      - usability
    maps_to:
      - gvp:G1
      - gvp:G2
      - gvp:P9
      - gvp:P15
      - gvp:R4

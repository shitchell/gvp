  - id: D52
    name: Registry writes are atomic
    rationale: |
      Idempotent content is not sufficient on its own. D22's write path is a bare synchronous file write, which truncates and then writes, so a concurrent reader can observe a partially written file. That is not merely a bad read: the existing prune UNLINKS any entry it cannot parse, and with the default flipped by D43 it runs for every user on every invocation. A torn read during a concurrent write would therefore delete a live entry -- data loss, not a benign lost update, arising from the interaction of two behaviors that are each individually reasonable.
      All registry writes are therefore performed by writing a temporary file in the same directory and renaming it over the target, which is atomic on POSIX. This applies to the existing project entries as well, which carry the same defect today and are being written far more often after D43.
            **Scope: atomic with respect to concurrent READERS, not durable across machine crashes.** The temp file is not fsynced before the rename and the parent directory is not fsynced after it, so a crash can still leave the entry at its previous content or, on filesystems without ordered-rename semantics, absent entirely. This is stated because the decision's own name would otherwise overclaim: a reader — human or, per G7, an agent planning against this library — would take "writes are atomic" as the full crash-safety guarantee, and V10 requires a guarantee to be reliable or visibly absent. The decision already scopes itself on the adjacent axis ("atomic on POSIX"); this is the same move on the durability axis.
            Rationale for accepting the boundary, recorded by the implementer rather than decreed by the maintainer: per-write fsync would put a write barrier on every cairn invocation for every user once D43 makes recording universal, and D56 already ratifies that a lost registry entry is survivable — deleting the registry breaks nothing, it is only lossy to rebuild. A crash-lost entry is precisely a partial deletion of that already-survivable kind. If the maintainer weighs this differently, the fix is four lines in writeFileAtomic; the point of recording it is that the next reader inherits the trade instead of re-deriving it or silently paying for fsync.
    tags:
      - framework
      - integrity
      - tooling
    maps_to:
      - gvp:G6
      - gvp:V10
      - gvp:P18
      - gvp:C2
      - gvp:D22
    origin:
      - date: '2026-09-03'
        note: Found by adversarial review. Neither the first draft nor D22 addressed atomicity; the data-loss path only becomes reachable once D43 makes the prune run for everyone on every invocation.
    updated_by:

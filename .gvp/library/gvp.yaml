  - id: D25
    name: Optional summary field on all elements via _all.field_schemas
    rationale: |
      The description field serves two conflicting purposes: short form for indices, frontmatter, and list views, and long form for full inspection and teaching material. Enriched procedures with multi-paragraph descriptions produce bloated frontmatter and unusable list-view previews. Adding an optional summary field gives elements an explicit short-form representation without requiring silent truncation of description (P14). Declared in _all.field_schemas so every category (including custom categories) gets it for free, following the same mechanism as refs. Field ordering in defaults.yaml controls rendering order via Object.entries() insertion order -- summary is positioned first in _all.field_schemas so it renders before refs. Fallback on absence is blank (no emission), not truncation.

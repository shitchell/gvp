        date: '2026-09-25T21:21:17.379Z'
        note: Imported from patch-guidance.yaml
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
  - id: H11
    name: 'Retired: superseded by gvp:P19'
    status: deprecated
    summary: Tombstone. Superseded by gvp:P19; not guidance.
    statement: |
      RETIRED -- superseded by gvp:P19, which carries the full text. This entry is a tombstone, not guidance: consult gvp:P19.

      Reclassified from heuristic to principle on maintainer review, the same day it was authored and before any dependant shipped. The orthogonality judgement at its core -- "enumerate the concepts the user must understand; if any is machinery orthogonal to the task, the generality has leaked" -- turns on judging a concept orthogonal, which is a weighing call rather than a checkable condition, so it fails the hard/soft test a heuristic must pass.

      Kept so the id is never reused (gvp:R1) and never silently removed (gvp:R2). H11 was the highest heuristic at the time it was deleted, so its removal left no gap for W009 to catch and the next `cairn add heuristic` would have minted H11 a second time.
    tags:

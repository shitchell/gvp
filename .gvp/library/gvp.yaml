          - code-common:CP11
          - gvp:V10
      fix_the_variadic_only:
        description: |
          Make --override repeatable and stop there, leaving Commander in its default mode where a program option is consumed from anywhere in argv.
        rationale: |
          Rejected. It does fix the reported failure, and it is the least invasive option. But it leaves `query --help` advertising `-c, --category` while the program-level `-c` still wins, so `cairn query -c decision` keeps returning every element with exit 0. Help that documents a flag the parser will never honor is precisely the trust failure gvp:V10 names, and it is how this defect was mis-reported in the first place.
        would_have_served:
          - gvp:V4
        conflicts_with:
          - gvp:V10
          - gvp:V6
      redeclare_globals_by_hand:
        description: |
          Write the global options out explicitly on each of the thirteen subcommand builders instead of generating the mirror from program.options.
        rationale: |
          Rejected. It reads more plainly at each call site, but it is the same eight options copy-pasted thirteen times across files this change has no other reason to touch, and a global added later would be accepted in some subcommands and not others with nothing to detect the gap. Generating the mirror from one list is the composable form and keeps the declaration in one place.
        conflicts_with:
          - personal:V3
          - code-common:CP4

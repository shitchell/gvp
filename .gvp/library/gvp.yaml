  - id: D13
    name: '--skip-review flag for trivial changes'
    rationale: |
      The --skip-review flag writes a full provenance entry but marks it with skip_review: true, opting out of the review cycle. This is an escape hatch for genuinely trivial changes (typo fixes, formatting) where full review tracking would add noise without value. A 10-second typo fix should not trigger a review cycle. Unlike the previous --no-provenance approach, the full audit trail is preserved -- every change is recorded, but trivial changes don't trigger downstream review. Opting out is explicit, not silent, and nothing is lost.

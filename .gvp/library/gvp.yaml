        date: '2026-09-03T18:35:28.751Z'
        rationale: Record the atomicity/durability scope boundary surfaced during Task 2 implementation. D52's name claims 'writes are atomic'; writeFileAtomic does not fsync, so a crash can still lose the last write. V10 requires a guarantee to be reliable or visibly absent, and the decision already scopes itself on the POSIX axis. Acceptance reasoning attributed to the implementer, not the maintainer.

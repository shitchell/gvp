  - id: D19
    name: Procedure category for ordered step-governed workflows
    rationale: |
      The existing eight core categories (goal, value, constraint, principle, rule, heuristic, decision, milestone) are all stative -- they describe what is or should be true. None cleanly expresses procedural knowledge: a sequence of ordered steps, each governed by its own guiding elements. Heuristics are if/then decision procedures, but they lose ordering and per-step traceability. Rules are unconditional hard stops, also no ordering. Modeling a guide like "writing a Phase 2 cross-platform test" as a sequence of decisions or as a heuristic loses both the sequence and the step-local `maps_to` that connect each step back to the rules and principles that govern it specifically.
      The procedure category fills this gap. It is structurally domain-agnostic (R4): any cairn user needs a way to capture procedural knowledge, and the shape -- ordered steps with per-step traceability -- is universal even though any individual procedure is domain-specific. Steps use the same `maps_to` and `refs` mechanisms as element-level maps_to and refs -- no new relationship type, no new graph concept. A process-level `when` field captures runtime trigger context ("starting a new test or migrating a v1 test"), a process-level `related` list groups decisions/rules/heuristics that apply throughout rather than to a specific step.
      Step IDs follow dotted form: `{parent.id}.{N}` (1-indexed). They are auto-assigned at parse time when missing, with W015 emitted to nudge the user toward persisting explicit IDs. R1 preservation across step deletions requires persisted IDs, since load-time numbering is position-based and would silently renumber survivors. The `name` attribute carries the human-readability burden; no separate slug override exists, because two identity mechanisms for the same thing would violate V1 simplicity (the consumer's words: "keeps step IDs purely structural identifiers and avoids two ways to say the same thing").
      The category id_prefix is `S` (for Step / Sequence), a single character, per DEC-9.2 (all core category id prefixes are single characters; keep it simple and use 2+ chars only where required for uniqueness). The mnemonic points directly at the defining structural feature of a procedure -- the `steps` field -- so anyone who reads `S1.1` once understands what the letter stands for. The full ID form (`S1`, `S1.1`, `S1.2`) is visually unambiguous in every font, avoiding letter/numeral confusion. The category name itself stays `procedure`; `S` is strictly the ID prefix mnemonic.
      Considered alternatives for the id_prefix: - `P` (procedure): collides with principle. Rejected. - `T` (task): "task" is narrower than "procedure"; a procedure
        can contain multiple tasks, not the other way around. Rejected
        for semantic drift.
      - `W` (workflow): cleaner than Q, but "workflow" implies a
        cross-actor orchestration concept that a cairn procedure does
        not require. Still a reasonable fallback.
      - `O` (operation): similar semantic drift to task. - `Q` (initially chosen for neutrality): rejected post-review
        because it reads strongly as "question" and creates cognitive
        friction every time it appears in IDs and queries. Originally
        committed in 08bb667 and corrected in a follow-up commit
        before any procedures were authored.
      - `I` (for "instruction"): rejected for three reasons -- (a)
        visual ambiguity between capital-I, lowercase-l, and numeral-1
        in terminals and chat, where cairn IDs get quoted and pasted
        constantly; (b) "instruction" is weaker than it looks (an
        instruction is a single directive, a procedure is a sequenced
        guide); (c) natural-language collision -- "look at I3" reads
        awkwardly because I is a personal pronoun.

      S was chosen because the mnemonic matches the field, the character is visually unambiguous in every font, and it reads naturally in spoken and written English. Users who want a different mnemonic can override via a user-defined category in their own library.
      Validation: E001 (BROKEN_REFERENCE) is extended to walk step maps_to; E005 (DUPLICATE_STEP_ID) fires on explicit step id collisions within a procedure; W010/W011 are extended to step refs; W015 (AUTO_ASSIGNED_STEP_ID) nudges toward persisted IDs. All diagnostics reuse existing codes where the semantic is the same; E005 and W015 are the only new codes.
      Phase B deliberately does NOT add a `cairn add procedure` or `cairn add step` CLI command, a procedure-aware renderer, or a step-level graph node. Those belong to later phases (add command is out-of-scope; renderer is phase C). Phase B is the structural foundation that makes procedures parseable, queryable, exportable (as structured JSON), and validatable. Pretty rendering comes in phase C.
    tags:

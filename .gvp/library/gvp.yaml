  - id: D43
    name: Library recording defaults on, with a named opt-out
    rationale: |
      D22 made registry recording opt-in behind registry.enabled, reasoning that read commands should stay filesystem-read-only and that nothing should appear in a user's home directory uninvited. That default was falsified by evidence: roughly five months after D22 landed, registry.enabled was set in no config layer and the registry directory did not exist. The registry recorded nothing, ever.
      C1 ("Agents optimize for minimal effort") already ratifies why: agents do not enable flags they do not know exist. That is precisely the incident behind #15 -- an agent authored elements that already existed upstream because nothing told it the upstream library was there. A discovery feature that must itself be discovered before it works does not solve a discovery problem.
      P7 ("Respect the user's environment") is honored by the escape hatch and a trivially clearable location rather than by a default-off flag, per P8 ("Opinionated defaults with escape hatches"). The opt-out has two named surfaces, both gating WRITES only -- the libs commands always read: registry.enabled false in any config layer, and --no-registry for a single invocation, which CI and sandboxes need because they cannot always edit a config file.
      Flipping the default is not a one-word change. The config schema declares the registry object itself as optional, so omitting the registry key yields undefined and the enabled lookup stays falsy regardless of the inner default. The object needs a default of its own, and the schema comment stating the feature is off by default must be rewritten.
      The substantive cost is acknowledged: read-only commands now write to the home directory by default. D22 raised three objections -- CI sandboxes, multi-user environments, and auditability. D57's resilience answers the sandbox half; the other two are accepted costs of the flip, recorded here so the trade is explicit rather than overlooked.
            **Required mechanism: `mergeConfigs` must deep-merge the `registry` key.** The "in any config layer" clause above is not free -- config layering is otherwise last-wins per key, so a global `registry.enabled: false` plus a project config that merely mentions `registry:` for any reason would yield `{}`, the object default would fill in `enabled: true`, and recording would silently resume against an explicit opt-out. That is the worst available failure for this decision: it re-enables a write side effect precisely for the user who took the trouble to disable it. `registry` is therefore deep-merged while every other nested key stays last-wins.
            **Limit: `--no-config` defeats the CONFIG opt-out.** A global `registry.enabled: false` is discarded by `cairn --no-config validate` (and by `--config <other>`, and by an empty `GVP_CONFIG_GLOBAL`), so recording resumes. That is arguably what `--no-config` means -- but with the default now ON it means the flag that makes the tool quieter makes it write, which a reader of this decision alone would not predict. The `--no-registry` FLAG is unaffected: it is applied to the already-loaded config, so no config-discovery flag can reach it, and that is tested.
      **Amendment (2026-09-25): the opt-out is ONE mechanism with a set of admitted spellings; a library-scoped declaration joins the set.** The clause above says the opt-out "has two named surfaces", and tests/registry/docs.test.ts enforced that count literally. Both were counting SPELLINGS. There has only ever been one MECHANISM -- `registry.enabled` -- and both named surfaces set it: a config layer sets it directly, and `--no-registry` is applied by parseConfigOptions to the already-loaded config, which is precisely why no config-discovery flag can reach it. Counting spellings made the count brittle without making the guarantee any stronger, because every spelling of one mechanism inherits that mechanism's guarantees, precedence and tests by construction.
      A third spelling is admitted here: `meta.registry.enabled`, declared by a library about itself. It is warranted under P19 ("a named affordance is earned when the general mechanism leaks") -- reaching the same switch through the general mechanism, `meta.config_overrides`, obliges the user to learn that a document's meta can carry config at all, the `{mode, value}` wrapper, `replace` versus `additive`, and ancestor-wins precedence, none of which is about the registry. It is admitted as a SPELLING rather than as a third mechanism only because P19's delegation clause binds it: it must set `registry.enabled` and must not reimplement recording suppression. A version that reimplemented it would be a second mechanism and P11 would forbid it, so the delegation is the whole licence -- not an implementation note.
      Its scope is fixed by D60 ("a library's declared config governs its own writes, not its consumer's"), not left to the implementer. A library-scoped declaration governs the DECLARING library's own records and never the consuming invocation's. `config_overrides` is ancestor-wins (src/catalog/catalog.ts), so the unscoped reading -- an inherited library disabling its consumer's entire registry, including the consumer's own entries -- is the exact failure this spelling must not reproduce. That hazard, together with recording depending on how a library happens to be addressed, is what motivated the named spelling in the first place (#25).
      Why the rule was changed rather than bent, per personal:P9 ("follow rules uniformly, change them explicitly"): the original count was load-bearing for a real reason. An env var was drafted and deliberately removed during planning, and documenting a surface the decision had not admitted would have put the docs ahead of the decision. That reason survives this amendment intact and is not weakened by it; what changes is the UNIT being counted. The test now enumerates the admitted spellings and fails on any other, which enforces the original intent more precisely than "exactly two" did -- "exactly two" would have had to be broken to admit any spelling at all, including one that strengthens the guarantee. The line between the old rule and the new one is P19: a spelling is admitted only when the general mechanism leaks AND the new surface delegates to it; a spelling that merely saves typing is still refused, and the drafted env var remains undecided rather than admitted by implication.
      NOT IMPLEMENTED BY THIS AMENDMENT. This decides that `meta.registry.enabled` is admissible and fixes its semantics; no source change to the registry path accompanies it. Until it ships, the README must not document the spelling -- the same docs-ahead-of-code rule that removed the env var -- and the counting test guards that. Issue #25 carries the implementation.
    tags:
      - framework
      - usability
      - tooling
    maps_to:
      - gvp:G8
      - gvp:G7
      - gvp:V5
      - gvp:C1
      - gvp:P19
      - gvp:D60
      - gvp:D22
    considered:
      keep_opt_in_but_advertise_it:
        rationale: |
          Keeping registry.enabled default-off while having cairn init write it into new configs and advertising it via a one-time stderr notice was rejected: an agent working in an existing unconfigured project -- exactly the case in #15 -- would still record nothing.
        would_have_served:
          - gvp:V4
        conflicts_with:
          - gvp:G8
      environment_aware_default:
        rationale: |
          Defaulting on for interactive use and off when CI is detected was rejected as implicit environment-dependent behavior, which cuts against P14 ("Explicit over implicit"). The resilience requirement in D57 already covers the sandbox concern without branching on environment.
        would_have_served:
          - gvp:V7
        conflicts_with:
          - gvp:P14
      deep_merge_all_nested_config_objects:
        rationale: |
          Deep-merging every nested config object, rather than special-casing registry, would give one predictable layering rule instead of a key-dependent one -- mergeConfigs now behaves three different ways (validation_rules concatenates, strict OR-merges, registry deep-merges) with no declared rule for which bucket a new nested key falls into. Rejected for blast radius: changing layering semantics for every existing key is a far larger change than this decision needs, and would alter behavior for configs unrelated to the registry. The cost is that the choice of bucket stays implicit; if a third nested key ever needs merging, prefer establishing the general rule over adding a fourth special case.
        would_have_served:
          - gvp:V4
          - gvp:V6

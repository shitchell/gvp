  - id: D18
    name: meta.description as first-class document field
    rationale: |
      Documents need a short human-readable "what is this about" string that renderers, hook indexers, and CLI listings can surface without reading every element. This was previously available via `.passthrough()` on documentMetaSchema but was not a declared field and could not be relied upon by consumers. Promoting it to an explicit optional field is a small application of P14 (explicit over implicit) and V2 (Transparency): the shape is now documented in the schema, validated like every other meta field, and visible to anyone reading the type. The TAStest team's specific motivation was a SessionStart hook that builds an index of available procedure guides without parsing every YAML file -- `meta.description` is the obvious home for that string because it's universal across all document types, not a process-specific field. Process-level trigger context (the "when to use this guide" string) stays on the element, not on meta, because it describes element-specific data rather than document-level metadata.
    tags:

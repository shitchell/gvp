    considered:
      scope_only_the_new_spelling:
        rationale: |
          Ship `meta.registry.enabled` library-scoped and leave `meta.config_overrides.registry` ancestor-wins over the whole invocation, on the grounds that the new spelling is what #25 asked for and the general mechanism is pre-existing behaviour nobody had complained about. Refused on measurement and on P19. The measurement: `config_overrides` is the path D60's hazard was measured on, and it is the one that destroys the consumer's own entries -- 0 entries where 1 was correct. The principle: a spelling's licence under P19 is that it inherits the guarantees and precedence of what it delegates to, so two spellings of `registry.enabled` that disagree about whose registry they govern are two mechanisms, which is what P11 forbids and what admitting the spelling was supposed to avoid.
        would_have_served:
          - personal:V1
        conflicts_with:
          - gvp:D60
          - gvp:P19
          - gvp:P11
      gate_at_the_invocation_site:
        rationale: |
          Read the library's declaration in `src/cli/helpers.ts`, next to the existing `config.registry?.enabled !== false` check, and skip `recordLibraries` entirely when the root library opts out. Simplest possible diff and it passes the `--library <scratch>` case from the issue. Refused: that gate is all-or-nothing for the invocation, so it can express "do not record" but not "do not record ME", which is the distinction D60 fixes in advance. It would have honoured a root library's declaration and had nothing at all to say about an inherited one -- leaving the measured hazard open while looking fixed.
        would_have_served:
          - personal:V1
        conflicts_with:
          - gvp:D60
      a_separate_record_switch:
        rationale: |
          Give the library-scoped declaration its own name and its own code path -- `meta.registry.record: false` handled by a dedicated skip in `record.ts` -- rather than reducing it to `registry.enabled`. Refused outright: this is the second mechanism P11 forbids and the one thing P19's delegation clause exists to rule out. It would also have to re-derive, and keep in step, every guarantee `registry.enabled` already carries about precedence and about which commands write.
        conflicts_with:
          - gvp:P11
          - gvp:P19
          - gvp:D43
      strict_meta_schema:
        rationale: |
          Make `documentMetaSchema` strict so an unrecognized `meta` key is an error at parse time, which would make `meta.registry.enabled: false` impossible to get silently wrong. Refused: personal:V5 requires unknown fields to be preserved, not filtered, and `meta.library_id` is read purely through passthrough (R9 / #16), so strictness would break the registry's own correlation field. R12 is explicit that preserving and warning are not alternatives -- both, or the failure just changes shape.
        would_have_served:
          - personal:R2
        conflicts_with:
          - personal:V5
          - gvp:R12
      w019_only_inside_recognized_namespaces:
        rationale: |
          Warn only on unknown members of a recognized `meta` sub-namespace (`meta.registry.enable`) and stay silent on unknown top-level `meta` keys, so that forward-compatibility keys riding on passthrough keep working without noise. A real option, and the narrower reading of R12. Set aside because it leaves the likeliest mistake silent: `meta.registery:` -- the namespace itself misspelled -- is not inside any recognized namespace, so nothing would say anything, which is the exact #25 failure with the typo moved one level up. The noise objection is answered by the escape hatch R12 already names, `suppress_diagnostics: [W019]` under D7, rather than by suppressing the diagnostic for everyone.
        would_have_served:
          - gvp:C1
        conflicts_with:
          - gvp:R12
      suppress_the_project_entry_too:
        rationale: |
          Have a root library's opt-out also suppress the project entry in the `by-id` keyspace, so a scratch project leaves no trace anywhere. Tempting, because a throwaway copy does mint a fresh project_id and so does pollute that keyspace too. Set aside: D60 scopes a library's declaration to "that library's own records", and a project entry records the project, not the library. It also misfires under `--library <someone else's library>`, where the declaring library belongs to a different project entirely -- suppressing the invoking project's entry on a stranger's say-so is the over-reach D60 forbids, arriving by the other door. A scratch project that wants neither keyspace still has the config layer and `--no-registry`.
        would_have_served:
          - gvp:G8
        conflicts_with:
          - gvp:D60
          - gvp:D22

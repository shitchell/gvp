  - id: D54
    name: Ship cairn libs list, show, and search
    rationale: |
      D22 explicitly placed a registry query command out of scope, reasoning that consumers walk the directory themselves and cairn just maintains the data. That reasoning held for one flat keyspace. It stops holding under D51, where facts are split across two keyspaces and the usage edge must be derived by inversion -- correct data that no one will assemble by hand. C1 and P11 point the same way: an agent will not reliably hand-roll a two-keyspace walk, and #15's downstream consumer needs a single command to name in its own guidance.
      Four points the first draft left underspecified, each of which had a plausible reading that would have shipped a broken feature:
      (1) WHAT SEARCH MATCHES -- not "names and statements." Decisions carry rationale and constraints carry impact, so that reading would ship a search structurally incapable of matching a decision, which is exactly the content the motivating incident was about. Search matches the name plus each category's primary field RESOLVED FROM THE SCHEMA, per the D17 mechanism. Hard-coding field names would violate R6.
      (2) AMBIGUITY IN SHOW -- since names are explicitly not unique per D46, show lists all matches and requires a source-and-document-path selector when more than one exists. Silent first-match would contradict this library's own handling of ambiguous references.
      (3) UNCACHED REMOTES -- resolving an evicted remote triggers a remote ref query plus a shallow fetch, so search would silently become many network clones. The default is to skip uncached remotes WITH A WARNING NAMING THEM; a --fetch flag opts in. Skipping silently would reproduce the silent-miss failure #15 was filed about.
      (4) OUTPUT -- the consumer is an agent-facing ruleset, so all three commands support a --json mode with a stable schema. Human-formatted tables parsed by regex would defeat the purpose per G7.
      The list command takes a --kind filter (local or remote) and a --scope filter over meta.scope, whose vocabulary is user-defined and deliberately not enumerated by cairn.

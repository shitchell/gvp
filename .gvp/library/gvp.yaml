  - id: D57
    name: Recording failure never fails the command
    rationale: |
      A read-only home directory, a full disk, or a corrupt entry must never change the exit code or stdout of the command the user actually ran -- the index is not load-bearing for correctness, and #15 asks for exactly this behavior, to carry on and at most warn. This inherits D22's resilience posture, which wraps every registry filesystem operation and returns silently on failure.
      D22 swallowed such failures entirely. That is amended here: failure emits at most one stderr warning per invocation. Silent swallowing conflicts with V3 (Honesty); one line is loud enough to diagnose and quiet enough not to become noise on a machine where the condition persists.
            **Scope: "never fails the command" assumes the registry root is a normal filesystem path.** Under procfs it can instead never RETURN: `mkdir(2)` on `/proc` answers ENOENT even when the parent exists, and Node's recursive mkdir treats ENOENT as "create the parent and retry", looping forever. Verified: `GVP_REGISTRY_ROOT=/proc/self/x cairn validate` hangs indefinitely. Hanging is strictly worse than throwing, so this is stated rather than left implicit -- V10 asks that a guarantee be reliable or visibly absent. It requires a hostile root, so it is recorded rather than defended against; closing it would need a decision about validating the registry root.

      - usability
    maps_to:
      - gvp:G6
      - gvp:G9
      - gvp:P2
      - gvp:V5
      - gvp:V7
  - id: D5
    name: Layered documentation
    rationale: |
      README and user-facing docs stay non-technical for easy onboarding and minimal learning curve. Technical specs, schema details, and power-user docs live in docs/ for those who want depth. Neither audience hits a ceiling or a barrier.
    tags:
      - documentation
      - usability
    maps_to:

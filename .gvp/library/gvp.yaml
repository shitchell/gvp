  - id: D55
    name: Prune local entries by document; retain remote entries; provide explicit forget
    rationale: |
      D22's prune is path-based on the recorded location. For library entries that granularity is too coarse: the recorded source is a DIRECTORY, so deleting or renaming a single document inside a still-live library would orphan its entry permanently, and a rename would mint a second entry beside the first. Local entries are therefore pruned when the DOCUMENT FILE itself is gone.
      Remote entries are retained even when the cache is evicted, because they remain re-fetchable while the ref is still served. That qualifier matters and the first draft omitted it: a force-pushed SHA, a deleted tag, a repository made private, or simply being offline all break re-fetchability, so show reports such entries as not-currently-cached rather than promising availability.
      Unbounded retention is a real cost -- one entry per document per ref ever fetched, accumulating over years. A forget command taking a selector, and a prune command with a remote flag, provide the eviction surface. Deleting the registry directory satisfies #15's "trivially clearable" requirement but is not an answer to unbounded growth.
    tags:
      - framework
      - tooling
      - integrity
    maps_to:

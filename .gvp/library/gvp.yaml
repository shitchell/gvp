  - id: D53
    name: The usage edge is stored project-side and derived by inversion
    rationale: |
      Which projects have seen a given library, and when, is computed at read time by walking project entries rather than stored on the library entry, where a per-writer field would break the idempotence D51 depends on. The inversion is clean: "which projects use this library" is the transpose of "which libraries this project uses," which each project records about itself.
      The contention property must be stated accurately, because the first draft cited one that does not exist. D22 gives NO CROSS-PROJECT COLLISION -- one file per project UUID. It does not give freedom from same-project concurrency, and C2 declares parallel sessions in one project normal. Two such sessions both read-modify-write the same project entry. The usage-edge append is therefore a MERGE -- union by key, minimum of first_seen, maximum of last_seen -- so a lost update costs at most a stale timestamp instead of a dropped edge.
      Additionally, the registry preflight currently runs during config parsing, before the catalog is built. Left alone, each invocation would write the project file twice with a prune between them, doubling the window in which a torn read can occur. The two writes are folded into one, performed after catalog construction.

meta:
  name: gvp
  scope: project
  definitions:
    tags:
      framework:
        description: Core GVP framework design -- schema, element types, traceability model
      tooling:
        description: The gvp CLI utility and its implementation
      documentation:
        description: READMEs, glossary, specs, and examples
      alignment:
        description: Ensuring decisions trace back to goals and values consistently
      usability:
        description: Accessible to non-technical users and AI assistants alike
      integrity:
        description: Data correctness, provenance, and trustworthiness of the GVP store
      extensibility:
        description: Supporting user-defined categories, tags, validation, and output formats
      code:
        description: Code-level patterns and implementation heuristics
  defaults:
    origin:
      - date: '2026-02-23'
        note: Inferred from planning sessions
  inherits:
    - source: '@github:shitchell/gvp-docs@v0.7.0'
      as: me
goals:
  - id: G1
    name: Facilitate alignment across collaborators
    statement: |
      Collaborators -- human or AI -- can consult the GVP store to understand how decisions are made and why, producing plans and work that align with stated goals and values without repeated explanation. Applies during planning, execution, and review.
    tags:
      - framework
      - alignment
    maps_to: []
  - id: G2
    name: Facilitate easier planning for AI and humans
    statement: |
      Decision-making context is already documented, so new planning sessions start from shared ground rather than blank slates.
    tags:
      - framework
      - alignment
      - usability
    maps_to:
      - gvp:G1
  - id: G3
    name: Enable periodic review of GVPs
    statement: |
      Users can revisit their goals, values, and principles over time to verify they still hold true, updating or deprecating those that no longer apply.
    tags:
      - framework
      - integrity
    maps_to:
      - gvp:G4
  - id: G4
    name: Review guiding values against their results
    statement: |
      Users can examine whether their stated values are actually producing outcomes coherent with their goals, surfacing contradictions or drift.
    tags:
      - framework
      - alignment
      - integrity
    maps_to: []
  - id: G5
    name: Ensure internal consistency across all scopes
    statement: |
      The framework helps detect and surface misalignment between elements at different scopes so contradictions are visible rather than hidden.
    tags:
      - framework
      - alignment
    maps_to: []
  - id: G6
    name: Works anywhere
    statement: |
      The tool should work for organizations, teams, and individuals alike -- across domains, project structures, and workflows. This includes being domain-agnostic in its core design.
    tags:
      - framework
      - usability
    maps_to: []
  - id: G7
    name: Usable by AI assistants
    statement: |
      AI assistants should be able to read, query, and propose changes to GVP stores as part of planning and development workflows.
    tags:
      - framework
      - alignment
    maps_to:
      - gvp:G1
  - id: G8
    name: Just works out of the box
    statement: |
      The tool should work correctly and predictably with minimal setup. Sensible defaults, automatic discovery, and progressive fallbacks mean a user can start using the tool without reading documentation or writing configuration.
    tags:
      - framework
      - usability
    maps_to:
      - gvp:G6
  - id: G9
    name: Adapts to the user
    statement: |
      The tool should conform to the user's environment, needs, and how they conceptualize and model their goals and projects -- rather than demanding the user conform to the tool.
    tags:
      - framework
      - usability
      - extensibility
    maps_to: []
  - id: G10
    name: Automated detection of similar and conflicting elements
    statement: |
      The framework should progressively improve its ability to automatically detect elements that are semantically similar, potentially conflicting, or unmapped despite apparent relevance -- reducing the burden on humans and AI agents to manually discover these relationships.
    tags:
      - framework
      - alignment
      - tooling
    maps_to:
      - gvp:G5
      - gvp:G7
    origin:
      - date: '2026-03-26'
        note: Added during post-v1 heuristic mining -- supports Surface Tension principle
  - id: G11
    name: Enable reuse of guiding elements across projects
    statement: |
      A guiding element authored once should be discoverable and reusable by every later project, without depending on a human remembering that it exists. The framework's other goals govern alignment, review, and consistency WITHIN a library; this one governs the boundary between libraries -- a new project must be able to find that the element it is about to author already exists upstream. G10 is adjacent but scoped to within-library similarity analysis, not cross-library discovery.
    tags:
      - framework
      - alignment
      - tooling
    maps_to:
      - gvp:G2
      - gvp:G7
    origin:
      - date: '2026-09-03'
        note: 'Filed as issue #15 after a session hand-authored ~48 elements for a new project and flagged three as having unrecoverable rationale -- all three already existed in the owner''s personal library. One derived substitute was wrong and propagated into project guidance before a human caught it.'
values:
  - id: V1
    name: Alignment
    statement: |
      Shared understanding between agents -- human or AI -- of what the vision is and how we're getting there. Across people, across projects, across time.
    tags:
      - framework
      - alignment
    maps_to:
      - gvp:G1
  - id: V2
    name: Coherency
    statement: |
      The system of decisions should be internally consistent. Elements across scopes should not contradict each other. The graph matters more than any single element.
    tags:
      - framework
      - integrity
    maps_to:
      - gvp:G5
  - id: V3
    name: Honesty
    statement: |
      Capture real reasoning, even when messy or uncomfortable. Fuzzy gut feelings are valid starting points worth documenting. Presenting a clean facade over unclear motivations helps no one.
    tags:
      - framework
      - integrity
    maps_to:
      - gvp:G3
      - gvp:G4
  - id: V4
    name: Simplicity
    statement: |
      The quality of being uncomplicated and easy to understand. Complexity must earn its place.
    tags:
      - framework
      - tooling
    maps_to:
      - gvp:G8
  - id: V5
    name: Approachability
    statement: |
      Meet users where they are. The framework should be intuitive regardless of domain expertise or technical background -- through layered documentation, domain-specific examples, and terminology that fits the audience.
    tags:
      - framework
      - usability
    maps_to:
      - gvp:G6
  - id: V6
    name: Clarity
    statement: |
      Easy, simple understanding throughout all aspects of the system -- its usage, its output, and its interwoven philosophies.
    tags:
      - framework
      - usability
    maps_to:
      - gvp:G1
      - gvp:V5
  - id: V7
    name: Flexibility
    statement: |
      Systems should be adaptable to different environments, preferences, and unforeseen contexts.
    tags:
      - framework
      - extensibility
    maps_to:
      - gvp:G9
  - id: V8
    name: Configurability
    statement: |
      Users should have control over how the system behaves in their context.
    tags:
      - framework
      - extensibility
    maps_to:
      - gvp:G9
      - gvp:V7
  - id: V9
    name: Auditability
    statement: |
      Every action that changes the state of the system leaves a complete, immutable trace. Where traceability ensures decisions connect to their justification (the "why"), auditability ensures every change is recorded (the "what" and "when"). Data may be excluded from review cycles, but it is never excluded from the record.
    tags:
      - framework
      - integrity
    maps_to:
      - gvp:G3
      - gvp:G4
      - gvp:V2
      - gvp:V3
    origin:
      - date: '2026-03-19'
        note: Added during v1 design review -- driven by DEC-4.6 (--skip-review records full provenance) and DEC-1.0a (fully transitive, transparent dependencies)
  - id: V10
    name: System Integrity
    statement: |
      The system should be trustworthy. Its outputs, its state, and its guarantees should be reliable -- or visibly absent.
    tags:
      - framework
      - integrity
    maps_to:
      - gvp:V2
      - gvp:V3
    origin:
      - date: '2026-03-26'
        note: Added during post-v1 heuristic mining -- the system is either fully valid or refuses to operate
principles:
  - id: P1
    name: Capture rationale always
    statement: |
      Every decision should include its rationale. Use direct quotes where possible. Never infer, assume, or paraphrase someone's reasoning. If rationale was not discussed, note it as TBD and follow up.
    tags:
      - framework
      - integrity
      - alignment
    maps_to:
      - gvp:G1
      - gvp:G2
      - gvp:V1
      - gvp:V3
  - id: P2
    name: Fuzzy boundaries are a feature
    statement: |
      Categories are tools for thinking, not rigid taxonomies. Goals and values are tightly coupled and co-evolve. Tags embrace the fuzziness of human conceptualization rather than forcing hierarchical boxes.
    tags:
      - framework
      - usability
    maps_to:
      - gvp:G6
      - gvp:V5
      - gvp:V7
  - id: P3
    name: Source of truth is structured data
    statement: |
      The source of truth should be well-defined, parseable, and manipulable with deterministic tools. Consistency and scriptability matter more than the specific format.
    tags:
      - framework
      - integrity
      - tooling
    maps_to:
      - gvp:G1
      - gvp:G7
      - gvp:V2
      - gvp:V4
  - id: P4
    name: Enforce standards through appropriate friction
    statement: |
      Adherence to standards should be supported by the right level of enforcement -- from transparency and trust where risk is low, to active friction where attention matters, to hard stops where violation is destructive or irreversible.
    tags:
      - framework
      - integrity
      - usability
    maps_to:
      - gvp:G3
      - gvp:G4
      - gvp:V2
      - gvp:V1
      - gvp:C1
  - id: P5
    name: Design around flex points
    statement: |
      When a specific future change is plausible, design around it now rather than refactoring later. A little upfront complexity in the interface buys future simplicity. This does not mean implementing the change early -- it means shaping the architecture so the change is not painful when it arrives.
    tags:
      - framework
      - tooling
    maps_to:
      - gvp:G2
      - gvp:V4
      - gvp:V2
      - gvp:V7
  - id: P6
    name: Minimize friction while maintaining coherency
    statement: |
      The default posture is to impose the least friction necessary to maintain alignment and coherency. Where possible, make the right thing easy rather than making the wrong thing hard. But where coherency demands friction, friction wins.
    tags:
      - framework
      - usability
      - integrity
    maps_to:
      - gvp:G5
      - gvp:V2
      - gvp:V4
      - gvp:V5
      - gvp:C1
  - id: P7
    name: Respect the user's environment
    statement: |
      Integrate with existing conventions and configurations rather than imposing new ones. Use platform idioms, mirror patterns from established tools, and respect the user's choices about their own workflow.
    tags:
      - framework
      - tooling
      - usability
    maps_to:
      - gvp:G6
      - gvp:G9
      - gvp:V5
      - gvp:V7
  - id: P8
    name: Opinionated defaults with escape hatches
    statement: |
      Offer well-considered defaults that push toward stated goals and values. Always provide explicit opt-outs to accommodate unforeseen scenarios where the defaults fall short.
    tags:
      - framework
      - usability
      - extensibility
    maps_to:
      - gvp:G8
      - gvp:G9
      - gvp:V4
      - gvp:V5
      - gvp:V3
      - gvp:V7
  - id: P9
    name: Optimize signal-to-noise ratio
    statement: |
      Present the right information at the right time. More is not better -- relevance matters more than comprehensiveness. Hide what is not actively needed, but never lose it.
    tags:
      - framework
      - usability
    maps_to:
      - gvp:G1
      - gvp:G2
      - gvp:V6
      - gvp:V4
      - gvp:V5
  - id: P10
    name: Lean on established standards
    statement: |
      When facing a design or architectural choice, look to established standards and conventions in the ecosystem for guidance. Proven patterns from mature tools (language compilers, linters, frameworks) carry hard-won lessons. Adopt them where they fit rather than inventing from scratch. Deviate only with clear rationale for why the standard doesn't apply.
    tags:
      - framework
      - tooling
    maps_to:
      - gvp:G8
      - gvp:V4
      - gvp:V2
      - gvp:P7
    origin:
      - date: '2026-03-19'
        note: Added during v1 Theme 5 design review -- driven by DEC-5.7 (ESLint/Zod precedent for exception vs diagnostic split)
  - id: P11
    name: Collapse redundant mechanisms
    statement: |
      When two mechanisms serve the same purpose, eliminate the weaker one rather than adding coordination logic between them. When two mechanisms look structurally similar but serve different purposes, keep them distinct. Purpose -- not structural similarity -- determines whether to merge.
    tags:
      - framework
      - tooling
    maps_to:
      - gvp:G5
      - gvp:V4
      - gvp:V2
    origin:
      - date: '2026-03-26'
        note: Added during post-v1 heuristic mining -- driven by DEC-2.15 (drop libraries config), DEC-5.5 (suppress over conditional), DEC-9.3 (tags over custom categories)
    refs:
      - file: src/inheritance/source-resolver.ts
        identifier: findLibrarySubdir
        role: implements
      - file: src/utils/yaml-files.ts
        identifier: findYamlFiles
        role: implements
    updated_by:
      - id: 1cd774ae-69b5-4e77-a0ad-99c3ab8d7bf9
        date: '2026-09-04T21:44:27.958Z'
        rationale: 'Task 14: P11 had no refs. This branch produced its two clearest artifacts -- findLibrarySubdir collapsed the duplicated gvp/ vs .gvp/library dual-lookup into one definition with caller-supplied fallbacks (the ''same purpose, eliminate the weaker one'' case), and findYamlFiles collapsed two byte-identical YAML walkers into one.'
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
    reviewed_by:
      - id: be177a5e-85ce-4290-9c86-7e565338b329
        date: '2026-09-04T21:50:23.143Z'
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
        updates_reviewed:
          - 1cd774ae-69b5-4e77-a0ad-99c3ab8d7bf9
        note: Refs added during Task 14 (D40-D58) and Task 15 (D56 README). Mechanical ref additions linking each decision to its implementation; no rationale changed.
  - id: P12
    name: Surface tension, don't resolve it
    statement: |
      The framework records and traces the state of goals, values, principles, and decisions -- creating a structured record that makes tensions, gaps, and misalignments discoverable. It does not auto-detect or auto-resolve these issues. The responsibility of finding misalignment largely rests with humans or AI agents reviewing the traced state. When gaps or conflicts are identified (whether by humans, AI agents, or optional tooling like embedding-based analysis), the framework provides the structured context needed to understand them -- but resolution is always a human decision.
    tags:
      - framework
      - alignment
      - integrity
    maps_to:
      - gvp:G4
      - gvp:G5
      - gvp:G10
      - gvp:V1
      - gvp:V3
    refs:
      - file: docs/philosophy.md
        identifier: The Framework Serves Alignment, Not People
        role: defines
      - file: src/analysis/analyzer.ts
        identifier: findUnmappedRelationships
        role: implements
    origin:
      - date: '2026-03-26'
        note: Added during post-v1 heuristic mining -- framework informs, humans decide
  - id: P13
    name: Refuse to operate on a broken foundation
    statement: |
      When the system's structural invariants -- schemas, configuration, category definitions -- cannot be fully validated, the system should refuse to proceed rather than operating in a partially valid state. Unreliable output is worse than no output. Core functionality either works completely or fails clearly. Optional or peripheral features may degrade gracefully (P8), but the foundation must be sound.
    tags:
      - framework
      - integrity
      - tooling
    maps_to:
      - gvp:G5
      - gvp:V10
      - gvp:V2
      - gvp:V3
      - gvp:P4
    refs:
      - file: src/catalog/post-merge-validation.ts
        identifier: validateMergedCategories
        role: implements
      - file: src/catalog/catalog.ts
        identifier: Catalog
        role: implements
      - file: src/config/loader.ts
        identifier: loadConfig
        role: implements
    origin:
      - date: '2026-03-26'
        note: Added during post-v1 heuristic mining -- driven by DEC-5.7, DEC-5.13, DEC-3.6
  - id: P14
    name: Explicit over implicit
    statement: |
      When the choice is between a concise but implicit/inferred behavior and a verbose but explicit one, prefer explicit. Accept verbosity when it eliminates ambiguity. No auto-deriving, no wildcards, no "what did you probably mean" inference. If the user must understand what the system is doing, make them say it.
    tags:
      - framework
      - tooling
      - integrity
    maps_to:
      - gvp:G5
      - gvp:V6
      - gvp:V10
      - gvp:P3
    refs:
      - file: src/schema/reserved-fields.ts
        identifier: checkReservedFieldCollision
        role: implements
      - file: src/validation/runner.ts
        identifier: runValidation
        role: implements
      - file: src/inheritance/source-resolver.ts
        identifier: GitSourceResolver
        role: implements
    origin:
      - date: '2026-03-26'
        note: Added during post-v1 heuristic mining -- driven by DEC-2.13 (explicit mode/value), DEC-5.11 (exact-match suppression), DEC-6.6 (no magic git derivation)
  - id: P15
    name: Dogfood your own abstractions
    statement: |
      When the framework defines an abstraction -- a loading pipeline, a validation system, an extension interface -- use that same abstraction for all built-in functionality. Built-in defaults should load through the same pipeline as user-defined data. This is especially important for dynamic, modular frameworks where the extension points ARE the product.
    tags:
      - framework
      - tooling
      - integrity
    maps_to:
      - gvp:V10
      - gvp:V2
      - gvp:G8
    refs:
      - file: src/schema/defaults-loader.ts
        identifier: loadDefaults
        role: implements
      - file: src/data/defaults.yaml
        identifier: categories
        role: defines
    origin:
      - date: '2026-03-26'
        note: Added during post-v1 heuristic mining -- driven by DEC-9.4 (defaults.yaml through same pipeline as user files)
  - id: P16
    name: Strict types end-to-end
    statement: |
      Every data structure -- from YAML parse output through model layer to CLI output -- should be fully typed such that IDE autocomplete works at every point in the chain. If a developer can't dot-into a field and see completions, the typing is insufficient. Prefer typed interfaces over Record<string, unknown>, typed discriminated unions over any, and schema-derived types over hand-maintained ones. Transient untyped states (e.g., raw YAML fragments awaiting schema resolution) are design smells -- restructure the pipeline so the data is typed from the moment it enters the system.
    tags:
      - tooling
      - code
      - integrity
    maps_to:
      - gvp:G7
      - gvp:V10
      - gvp:P3
      - gvp:P14
  - id: P17
    name: Decreed inputs are not derived
    statement: |
      A stakeholder-decreed input (a user_requirement) may resonate with a value — it can and should map to the value it is partially-motivated-by — but it is NOT derived from that value. The value under-determines the requirement; the residual the value cannot re-derive IS the decreed core. Therefore tooling and reviewers must read a requirement→value link as "resonates-with / partially-motivated-by," never as "derived-from," and must never attempt to re-derive or re-open a decreed root from the values it maps to. The same holds for the other decreed/exogenous roots (constraint, exclusion): mapping them to a value records resonance, not derivation.
    tags:
      - framework
      - alignment
      - integrity
    maps_to:
      - gvp:G1
      - gvp:V3
    origin:
      - id: 8a215be5-8888-4210-b2d9-29b7db2c8791
        date: '2026-07-20T23:00:05.014Z'
        note: Imported from guiding-patch.yaml
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
  - id: P18
    name: Prefer idempotent writes over locking for shared state
    statement: |
      When concurrent writers to a shared location necessarily produce identical content, contention is harmless by construction and no lock is required. Prefer designs that arrange for that property -- by splitting state along the axis of what differs between writers -- over designs that permit differing concurrent writes and then coordinate them. A correctness argument that rests on the shape of the data has no failure mode to get wrong; one that rests on a lock has several.
      The property is fragile and must be maintained deliberately. Adding a single per-writer field -- a timestamp, a counter, a hostname -- silently destroys it while leaving the code that relied on it unchanged. And idempotent content alone does not make a concurrent READER safe: without an atomic replace, a reader can observe a truncated file mid-write. Idempotence removes the need for mutual exclusion between writers; it does not remove the need for atomicity.
    tags:
      - framework
      - tooling
      - integrity
    maps_to:
      - gvp:G6
      - gvp:V10
    origin:
      - date: '2026-09-03'
        note: Extracted while designing the library registry (#15), where two projects inheriting the same library would otherwise contend on one entry file. The fragility and atomicity caveats were added after adversarial review found the first draft of this design had already violated both.
  - id: P19
    name: A named affordance is earned when the general mechanism leaks
    statement: |
      A general mechanism does not substitute for a named affordance when using it requires understanding concepts unrelated to the task.

      Default to reuse. An existing general surface should answer a new need, and adding a second way to say the same thing is normally the redundant-mechanism smell P11 exists to catch; CP11 says the same from the other side -- check whether a new surface can reuse an existing one before introducing it.

      Then check the cost of that reuse at the INTERFACE, not at the engine. Enumerate the concepts the user must understand to reach their goal through the general mechanism. If every one of them is about the task, the general mechanism is the answer and no new surface is warranted. If any of them is machinery orthogonal to the task -- an extra wrapper, precedence semantics, a blast radius wider than what the user is trying to affect, a subsystem they had no reason to know exists -- then the generality has leaked into the interface, and a narrow named affordance is warranted for that one task.

      THE NAMED AFFORDANCE MUST DELEGATE TO THE GENERAL MECHANISM, NEVER REIMPLEMENT IT. This clause is not decoration; it is what keeps P11 SATISFIED rather than overridden. One mechanism with two spellings is not two mechanisms. It also fixes how the new surface must be counted: a spelling inherits every guarantee, every precedence rule and every test of the thing it delegates to, so a standing decision that enumerates "the mechanisms" is not contradicted by adding one. A named affordance that reimplements the behaviour IS a second mechanism, and P11 forbids it -- the delegation is the whole licence. H6 says this by layer: unify the engine where purpose is shared, let the interface keep distinct entry points for distinct user intents.

      Worked cases. (1) Opting ONE LIBRARY out of the registry through the general mechanism obliges the user to learn that a document's `meta` can carry config at all, the `{mode, value}` wrapper that carries it, what `replace` means as against `additive`, and that resolution is ancestor-wins over the whole consuming invocation. None of those four concepts is about the registry; the mechanism has leaked, and a named library-scoped opt-out that sets the same underlying switch is warranted. (2) The same test returns the same answer for `--no-registry` (D43), and returned it before this principle existed: asking a CI job to reach `registry.enabled: false` obliges it to learn config-layer discovery and to write a config file it may not be permitted to write. (3) It returns the opposite answer for a proposed shorthand that merely saves typing over an existing flag -- the concepts involved are all about the task, so the shorthand is a second spelling with no leak to justify it, and P11 rejects it.

      WHY THIS IS A PRINCIPLE AND NOT A HEURISTIC. The enumerate-the-concepts step looks like a test but does not decide by itself: judging a concept "machinery orthogonal to the task" is a weighing call, and two readers applying it honestly can reach different answers on the same case. A heuristic's test must be checkable; this one states a preference and supplies a frame for arguing it. Graduation to a heuristic stays available once the orthogonality test has survived enough real use to be stated as a condition rather than a judgement.
    tags:
      - framework
      - tooling
      - usability
    maps_to:
      - gvp:P11
      - gvp:H6
      - gvp:V5
      - gvp:C1
      - personal:P8
      - code-common:CP11
    origin:
      - date: '2026-09-25'
        note: 'Authored to settle when a narrow named surface is warranted over an existing general one, which P11, H6, personal:P8 and code-common:CP11 together left open -- they establish the preference for reuse but name no condition under which reuse stops being the answer. Surfaced by issue #25, where the general mechanism (meta.config_overrides) technically reaches the goal but only through four concepts unrelated to it.'
      - id: a0596d8b-d2f6-45d4-bea7-55dbd553e261
        date: '2026-09-25T21:21:17.379Z'
        note: Imported from patch-guidance.yaml
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
      - date: '2026-09-25'
        note: 'Reclassified from heuristic gvp:H11 to principle gvp:P19 on maintainer review, before any dependant shipped. The hard/soft test fails: the core step -- "enumerate the concepts the user must understand; if any is machinery orthogonal to the task, the generality has leaked" -- turns on judging a concept orthogonal, which is a weighing call rather than a checkable condition, so two readers can differ. Per the cairn skill a soft preference filed as a heuristic is a miscategorisation. Body text and mappings are preserved verbatim apart from the added closing paragraph recording this reasoning; H11 is retired and its id is never reused (R1). Graduation back to a heuristic stays available once the orthogonality test has survived real use.'
heuristics:
  - id: H1
    name: Core vs. example placement
    statement: |
      If a feature or element type is domain-specific, put it in examples. If it is structural and applies regardless of domain, put it in core.
    tags:
      - framework
      - extensibility
    maps_to:
      - gvp:R4
      - gvp:G6
      - gvp:V7
  - id: H2
    name: Review threshold
    statement: |
      If a change is trivial (typo fix, formatting), record it but skip review. If it changes meaning, intent, or scope, track and review it fully. Every change leaves a trace regardless -- the question is whether it warrants the review cycle.
    tags:
      - framework
      - integrity
    maps_to:
      - gvp:P4
      - gvp:V4
      - gvp:V9
    updated_by:
      - id: d9670797-769f-4bf8-b36a-e7e4b253bd6d
        date: '2026-03-19'
        rationale: Updated to reflect v1 design decision DEC-4.6 -- provenance is always recorded, only review is skippable
    reviewed_by:
      - id: facdb118-826e-4d8c-9e52-d7c36b599773
        date: '2026-04-13'
        by:
          name: claude-worker PM session
          email: noreply@anthropic.com
        updates_reviewed:
          - d9670797-769f-4bf8-b36a-e7e4b253bd6d
        note: Bulk review of pre-v1 updates. Statement accurately reflects DEC-4.6.
  - id: H3
    name: Simplicity vs. flex point trade-off
    statement: |
      Default to the simpler option. Then evaluate: (1) Is there a specific plausible future change that this decision affects? If no, keep it simple. (2) If yes, does designing around it now add significant complexity or cost? If yes, document the deferred alternative and move on. If no, design around it now. When in doubt, simplicity wins.
    tags:
      - tooling
      - framework
    maps_to:
      - gvp:P5
      - gvp:V4
      - gvp:P1
  - id: H4
    name: Enforcement level selection
    statement: |
      Is the action low-risk and easily reversible? Allow it freely with transparency. Could the action compromise coherency but is recoverable? Add friction -- warnings, required confirmation, visible diffs. Is the action destructive, irreversible, or a direct violation of a rule? Block it entirely.
    tags:
      - framework
      - integrity
    maps_to:
      - gvp:P4
      - gvp:P6
      - gvp:C1
  - id: H5
    name: Friction proportionality check
    statement: |
      Does the friction feel disproportionate to the significance of the action? If yes, scale it down or provide an escape hatch -- friction that feels unjustified breeds resentment and undermines adoption. If no, the friction is appropriate.
    tags:
      - framework
      - usability
      - integrity
    maps_to:
      - gvp:P4
      - gvp:P6
      - gvp:C1
  - id: H6
    name: Evaluate collapse by layer
    statement: |
      When deciding whether to collapse two systems into one, evaluate at each layer independently. The engine layer should unify where purpose is shared -- one mechanism, not two doing the same job. The interface layer (CLI, API, class hierarchy) may keep distinct entry points for different user intents, even when the engine underneath is shared. Developer-facing APIs are UX too -- distinct method names serve mental categorization, not just distinct implementations.
    tags:
      - tooling
      - code
    maps_to:
      - gvp:P11
      - gvp:V4
      - gvp:P9
    origin:
      - date: '2026-03-26'
        note: Added during post-v1 heuristic mining -- driven by DEC-7.2 (export + inspect share exporter layer but are distinct commands)
  - id: H7
    name: Fail-fast at boundaries, collect all at analysis
    statement: |
      Prerequisites that must succeed before work can proceed should throw exceptions (fail-fast) -- bad config, broken schema, structural invariants. Analysis that inspects a valid system should collect all findings and report them together (collect-all) -- validation warnings, semantic checks, traceability gaps. The boundary is: "can the system be built?" vs "is the built system good?"
    tags:
      - tooling
      - code
      - integrity
    maps_to:
      - gvp:P13
      - gvp:V10
      - gvp:P4
      - gvp:P10
    refs:
      - file: src/catalog/catalog.ts
        identifier: Catalog
        role: implements
      - file: src/validation/runner.ts
        identifier: runValidation
        role: implements
      - file: src/errors.ts
        identifier: CatalogError
        role: defines
      - file: src/validation/diagnostic.ts
        identifier: Diagnostic
        role: defines
    origin:
      - date: '2026-03-26'
        note: Added during post-v1 heuristic mining -- driven by DEC-5.7 (exceptions vs diagnostics), DEC-5.13 (eager config validation)
  - id: H8
    name: Error when it affects current output
    statement: |
      If missing, invalid, or unavailable data has any possible impact -- direct or indirect -- on the correctness of the current operation's output, it is an error. Only skip the error when the gap has zero possible impact on the outcome; a warning is still appropriate.
    tags:
      - tooling
      - code
      - integrity
    maps_to:
      - gvp:V10
      - gvp:P13
      - gvp:P8
      - gvp:H4
    origin:
      - date: '2026-03-26'
        note: Added during post-v1 heuristic mining -- driven by DEC-7.11 (optional exporter failure timing), DEC-10.4 (ref parser graceful degradation)
  - id: H9
    name: Requirement vs Rule/Constraint/Goal delineation test
    statement: |
      To classify a decreed-or-standing element: (1) Who imposes it? An external stakeholder mandating it as input → candidate user_requirement; the team adopting it as a standing constraint on its own future decisions → candidate rule. (2) Is it derivable? Hand a reader every goal/value/principle: if the element falls out of them, it is a rule (derived, re-derivable from a value); if it does not fall out and must be handed over as a given, it is a user_requirement (it bottoms out at a stakeholder, not a value). (3) Shape: a binary, met-or-not-right-now condition decreed by a stakeholder → user_requirement; an open-ended state you steer toward → goal; an absolutely external, outside-our-control limitation → constraint; a self-imposed "we will not do X" boundary → exclusion. When (2) is decisive and the element is not derivable from any value, prefer user_requirement over rule.
    tags:
      - framework
      - alignment
    maps_to:
      - gvp:P17
      - gvp:P2
    origin:
      - id: 402a40ac-38b4-4abf-a838-dcd66afd12f1
        date: '2026-07-20T23:00:05.014Z'
        note: Imported from guiding-patch.yaml
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
  - id: H10
    name: Place a view by its data source, not its subject
    statement: |
      Views are placed by their data source, not by their subject matter. Two views can be about the same nouns and still belong on different commands, because what makes an answer trustworthy is which store produced it.

      In cairn the two stores are the RESOLVED CATALOG -- what `buildCatalog` produced for this invocation, i.e. the library this project will actually use -- and the MACHINE-GLOBAL REGISTRY -- every library cairn has ever resolved on this machine. A view over the resolved catalog belongs on a catalog-building command (`query`, `export`). A view over the registry belongs on `libs`. A single command never mixes the two stores, and a view is never derived from the registry when the catalog can answer it.

      The asymmetry is not stylistic. The registry is machine-wide: it does not know which of its entries the current invocation resolved, its names are deliberately not unique (D46), and its index unit is the document rather than the invocation (D45). A catalog question answered out of the registry is therefore answered from a strictly weaker store -- the answer may happen to be right, but the guarantee behind it is gone, which is the failure mode V10 names ("reliable -- or visibly absent"). The converse also holds: a question about libraries this invocation did NOT resolve cannot be answered by the catalog at all, however much it is "about libraries".

      THE TEST when a new view is proposed: name the store that must be read to produce it. If the command you were about to hang it on does not already read that store, it is the wrong command -- and if the answer would require reading both, it is two views, not one.

      Worked cases. A "which documents will this project actually use, with element counts" view (#24) is a catalog question and belongs on a catalog-building command, not on `libs`, even though its subject is libraries. A "list the inherited sources this library pulls in" view is likewise a catalog question. A "registry statistics for this project" view reads the registry and belongs on `libs`, even though its subject is this one project. And D54 needed no separate argument for putting `list`, `show` and `search` on `libs`: all three read the registry.
    tags:
      - tooling
      - usability
      - framework
    maps_to:
      - gvp:P11
      - gvp:V10
      - gvp:V6
      - gvp:C1
      - code-common:CP11
    origin:
      - date: '2026-09-25'
        note: 'Authored to settle where a resolved-library view belongs (issue #24), which the existing guidance left open. The placement axis is the data source; the subject-matter reading would have put a catalog view on `libs` because both are "about libraries".'
      - id: 5fca37a4-8d7a-4cba-8304-1f7935b4f159
        date: '2026-09-25T21:21:17.379Z'
        note: Imported from patch-guidance.yaml
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
  - id: H11
    name: 'Retired: superseded by gvp:P19'
    status: deprecated
    summary: Tombstone. Superseded by gvp:P19; not guidance.
    statement: |
      RETIRED -- superseded by gvp:P19, which carries the full text. This entry is a tombstone, not guidance: consult gvp:P19.

      Reclassified from heuristic to principle on maintainer review, the same day it was authored and before any dependant shipped. The orthogonality judgement at its core -- "enumerate the concepts the user must understand; if any is machinery orthogonal to the task, the generality has leaked" -- turns on judging a concept orthogonal, which is a weighing call rather than a checkable condition, so it fails the hard/soft test a heuristic must pass.

      Kept so the id is never reused (gvp:R1) and never silently removed (gvp:R2). H11 was the highest heuristic at the time it was deleted, so its removal left no gap for W009 to catch and the next `cairn add heuristic` would have minted H11 a second time.
    tags:

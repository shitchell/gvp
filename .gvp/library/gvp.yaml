  - id: D7
    name: Tiered validation (errors, warnings, strict)
    rationale: |
      Validation issues are categorized by severity. Errors block, warnings inform, strict mode promotes warnings to errors. Individual warnings are suppressible by code in config. This gives users control over how strictly the tool enforces standards.
    tags:
      - tooling
      - integrity
    maps_to:

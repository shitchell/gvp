  - id: D41
    name: Record every document in the resolved library directory, not only inherited ones
    rationale: |
      When a library is resolved, every YAML document in it is recorded, not only the documents the current project actually inherits. This is already what the existing source loader does -- it collects every YAML file in the resolved directory rather than only the inherited ones -- so the change is to state the behavior as intended rather than incidental.

rules:
  - id: R1
    name: IDs are never reused
    statement: |
      Once an ID has been assigned, it is permanently consumed. Deprecated or retired elements retain their IDs. New elements always receive the next sequential ID.
    tags:
      - framework
      - integrity
    maps_to:
      - gvp:G5
      - gvp:V2
  - id: R2
    name: No element deletion
    statement: |
      Elements are never removed from a GVP file. To retire an element, set status to deprecated. Retired elements may be moved to an archive document within the same library to reduce noise, but they remain part of the graph and their IDs are never reused (R1).
    tags:
      - framework
      - integrity
    maps_to:
      - gvp:G3
      - gvp:V2
      - gvp:V3
      - gvp:R1
  - id: R3
    name: All elements must trace to a goal and a value
    statement: |
      Every element that is not a root (goal, value, or constraint) must trace its justification to at least one goal and at least one value -- directly or transitively. Where alternative mapping paths are permitted (e.g., a heuristic mapping to a principle instead of directly to a goal + value), the alternative itself must trace through to a goal and a value. While goals, values, and constraints are not required to map to anything, mapping goals and values to each other is strongly encouraged -- it surfaces alignment gaps and strengthens review.
    tags:
      - framework
      - alignment
    maps_to:
      - gvp:G5
      - gvp:V1
      - gvp:V2
  - id: R4
    name: Core stays domain-agnostic
    statement: |
      The core framework must not contain domain-specific categories or terminology. Domain-specific elements belong in examples or user-defined extensions, not in the schema or core documentation.
    tags:
      - framework
      - extensibility
    maps_to:
      - gvp:G6
      - gvp:V5
      - gvp:V7
  - id: R5
    name: Manually tag 1.0.X-beta publishes with --tag latest
    statement: |
      While the cairn package is in the 1.0.X-beta prerelease series (no stable 1.0.0 release yet), every `npm publish` MUST manually advance the `latest` dist-tag. npm's default behavior is to NOT update `latest` for prerelease versions, so the tag stays pinned wherever it was last set. This is either `npm publish --tag latest` during the publish or `npm dist-tag add @principled/cairn@<version> latest` as a post-publish step. Verify with `npm view @principled/cairn version` which should return the newly published version. This rule is a hard stop in the release procedure — skipping it has concrete consequences: `latest` was stuck at 1.0.3-beta for an extended period, a fatally broken version that crashed on start because minimatch was in devDependencies (fixed in commit 9d65ce4). Fresh `npm install @principled/cairn` users got a non-functional package as their default. Discovered 2026-04-08 while diagnosing a TAStest consumer. This rule is superseded if a `postpublish` script automation lands in package.json (flagged in BACKLOG.md #5a as a follow-up); until then, the manual step is mandatory on every publish.
    tags:
      - tooling
      - integrity
    maps_to:
      - gvp:G8
      - gvp:V2
      - gvp:V10
      - gvp:P4
      - gvp:P13
    origin:
      - date: '2026-04-08'
        note: Requested by the human as a persistent release-procedure rule after diagnosing an ancient broken dist-tag during TAStest consumer debugging
    status: deprecated
    updated_by:
      - id: 16c8fe42-cd3e-4d89-9507-e33e67068c83
        date: '2026-07-20T23:04:08.949Z'
        rationale: 'Retired: leaving the 1.0.X-beta prerelease series for stable semver (gvp:R7, gvp:D35); premise no longer applies and postpublish automation supersedes it'
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
  - id: R6
    name: Subcommands and renderers dispatch on schema, not field names
    statement: |
      CLI subcommands, exporters, renderers, and validation passes must remain dynamic: they iterate over schema definitions (category field_schemas, registered category names, declared field types from the shape engine) rather than hard-coding specific field names or element category names. If a renderer needs to know that the procedure category has a `steps` field, or that the decision category has a `considered` field, that is a design failure -- the code should instead recognize `list<model>` or `dict<model>` as generic shapes and dispatch on the declared type. The same code path must handle any future field of the same shape without modification.
      The only permitted exception is the set of reserved fields declared in src/schema/reserved-fields.ts (RESERVED_FIELD_NAMES): id, name, status, tags, maps_to, priority, origin, updated_by, reviewed_by. These are load-bearing core framework fields that every element is guaranteed to have (they're part of reservedFieldsSchema in combined-schema.ts), and referencing them directly in CLI/renderer/validator code is permitted and expected. Fields declared in `_all.field_schemas` (e.g. `refs`) are NOT part of this exception surface yet, though they are candidates for promotion if a future decision tightens the universality guarantee.
      **Scoped exception (gvp:D33, 2026-07-20):** the coverage validation pass may read the `decision` category's declared `disposition` enum to gate the W013 (decision-no-refs) and W018 (root-no-decision) coverage checks. This is a deliberate, narrow extension of the exception surface -- the coverage pass is decision-centric by charter (it already keys on the `decision` category for W012/W013), and `disposition` is the facet that determines whether a decision's absence of refs is a coverage gap. It does NOT license field-name or category-name dispatch anywhere else: every other new pass still dispatches on schema, e.g. W017 (no-value-trace) and W018 dispatch on the `is_value_anchor` and `requires_decision` category flags, never on category-name literals.
      This rule is the hard-stop version of P15 (dogfood your own abstractions) and R4 (core stays domain-agnostic). The shape renderer added in C.1 is the canonical example of correct implementation -- its renderFieldByShape function dispatches on schema.type with no field names or category names in the switch. Its test suite includes a source-grep assertion (tests/exporters/shape-renderer.test.ts) that fails if anyone reintroduces field name string literals in the renderer code. Similar source-grep guards should be added when refactoring other generic code paths to comply with this rule.
      **Known violations at the time this rule was written (2026-04-08):** the structural-pass E001/E005 extensions for procedure steps, the semantic-pass W010/W011 extensions for step refs, and the parser's maybeAutoAssignStepIds function all hard-code `steps` and in one case `procedure` directly. These were added in Phase B before the generic shape-based approach was established in Phase C, and they need refactoring to iterate field_schemas generically. Tracked in .claude-worker-pm/BACKLOG.md #6 and obligated by this rule -- surfacing the debt is intentional.
      Does NOT apply to: src/data/defaults.yaml itself (that file IS the schema), src/schema/reserved-fields.ts (it DEFINES the exception surface), category-specific test files that exercise generic behavior against concrete shapes, or consumer libraries that declare their own user-specific categories.
    tags:
      - framework
      - tooling
      - extensibility
    maps_to:
      - gvp:G6
      - gvp:V7
      - gvp:P15
      - gvp:R4
    refs:
      - file: src/exporters/shape-renderer.ts
        identifier: renderFieldByShape
        role: implements
      - file: src/schema/reserved-fields.ts
        identifier: RESERVED_FIELD_NAMES
        role: defines
    origin:
      - date: '2026-04-08'
        note: 'Requested by the human after observing the PM correctly push back on a TAStest frontmatter feature request that implied hard-coded field knowledge. Guy''s words: ''we want to make sure all GVP subcommands remain dynamic, never favoring specific fields or elements (except sometimes the... [reserved fields], those are fine to reference).'' Landed under the autonomous-scope standing guidance from earlier in the same session.'
    updated_by:
      - id: 5951c7be-5f1c-4b0b-b15b-fee1ed909f93
        date: '2026-07-20T22:59:04.330Z'
        rationale: Amend R6 to name the scoped exception permitting the coverage pass to read the decision disposition enum (gvp:D33); leaves R6's general schema-dispatch prohibition intact
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
      - id: 9c5c3773-c5e4-41f2-9aba-81d861ce8713
        date: '2026-07-21T01:22:47.405Z'
        rationale: skip-review update
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
        skip_review: true
    reviewed_by:
      - id: ea949e89-8da0-4776-9446-a1194650f55e
        date: '2026-07-20T23:00:13.992Z'
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
        updates_reviewed:

        date: '2026-09-04T11:02:45.542Z'
        rationale: 'Record the mergeConfigs deep-merge as a mechanism D43 depends on: without it a project layer that merely mentions registry silently re-enables recording against a global opt-out.'
        by:
          name: shaun mitchell
          email: shaun@shitchell.com

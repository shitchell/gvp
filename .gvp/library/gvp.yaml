  - id: D34
    name: Top-side decision coverage via requires_decision flag (W018)
    disposition: accepted
    rationale: |
      Every root whose category declares requires_decision:true is an "actionable point-root" that should have at least one Decision tracing to it (any disposition — accept/decline/defer all count as actioned). W018 iterates the schema flag and hard-codes no category names (R6). goal, constraint, and user_requirement carry the flag; value (a direction, not a point) and exclusion (already its own resolution) omit it and are exempt by construction. Together with W012/W013 this closes the loop: nothing decreed goes silently unaddressed, nothing built goes silently unjustified. It is a coverage-pass warning (runs under --coverage), promotable under --strict.

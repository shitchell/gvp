  - id: R7
    name: Version bumps follow semantic versioning
    statement: |
      Cairn version numbers follow Semantic Versioning (semver.org). Given A.B.C: increment A (major) for backwards-incompatible / breaking changes, B (minor) for backwards-compatible features or enhancements, and C (patch) for backwards-compatible bug fixes. The published `latest` dist-tag always points at a stable A.B.C release; prerelease suffixes (e.g. 1.2.0-rc.1) may be used for previews under a non-`latest` tag. This supersedes the 1.0.X-beta prerelease convention (gvp:R5, deprecated); 1.1.0 is the first stable release.
    tags:
      - tooling
      - documentation
    maps_to:
      - gvp:G8
      - gvp:V6
    refs:
      - file: RELEASING.md
        identifier: Versioning
        role: defines
    origin:
      - id: 225d8ac5-8b62-4c30-a180-0d20ee98599e
        date: '2026-07-20T23:04:08.588Z'
        note: Imported from release-patch.yaml
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
  - id: R8
    name: Document names are unique within a library
    statement: |
      Every document's name (meta.name, falling back to documentPath) must be unique within its library — one source (`@local`, or one cloned repo). The library short address `[<alias>:]<meta.name>:<id>` resolves a document by name within a library, so a duplicate name makes references ambiguous — a broken foundation (P13/H8). Enforced as error E006 (DUPLICATE_DOCUMENT_NAME). Cross-library duplicates are permitted and disambiguated by the inheriting document's `as:` alias.
    tags:
      - framework
      - integrity
    maps_to:
      - gvp:G5
      - gvp:V10
    refs:
      - file: src/validation/passes/structural-pass.ts
        identifier: structuralPass
        role: implements
    origin:
      - id: a161e72d-1105-481a-86bf-b574c27e3264
        date: '2026-07-21T06:00:12.298Z'
        note: Imported from metaname-patch.yaml
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
  - id: R9
    name: Every GVP library carries a portable identity decreed upstream
    statement: |
      Every GVP library -- local or remote, embedded in a project or published standalone -- must carry a portable identity committed by its author and travelling with its content. A consumer that fetches a library may only READ that identity; it must never generate one locally.
      The reason is a fact about distribution that the rule exists to respect: an identity is only useful if every consumer agrees on it, and a UUID minted locally at fetch time would differ per consumer, manufacturing false distinctions between copies of one library. That is strictly worse than having no identity, which merely fails to collapse true ones. This is P17's shape ("decreed inputs are not derived") applied to identity rather than to requirements -- the identity is a decreed input to every consumer, and a consumer that re-derives it has produced a different thing.
      Not yet enforceable: no field exists to carry it. documentMetaSchema has no id field, and a published bare library repo has no .gvp/config.yaml in which to put one. Tracked as issue #16, which must settle where the identity is declared, how it relates to D21's project_id, and how it is made immutable. Until then the rule constrains design rather than data: D46 may not key on a locally generated identity, and D48 reads library_id if present without depending on it.
    tags:
      - framework
      - integrity
    maps_to:
      - gvp:G5
      - gvp:V10
      - gvp:P17
    origin:
      - date: '2026-09-03'
        note: 'Raised while designing the library registry (#15) and filed upstream as issue #16. Recorded as a rule rather than a constraint on the human''s correction: the impossibility of locally agreeing on a generated identity is the external fact, but requiring identity to be decreed upstream is a rule this project made.'
  - id: R10
    name: An inheritance alias never shadows a document name
    statement: |
      An `inherits` alias must not shadow any `meta.name` reachable in the graph -- neither a document in the declaring library nor a document in any library it inherits, directly or transitively.

      R8 makes document names unique within a library, but it is silent on the alias, and aliases and document names share ONE reference keyspace: `[<alias>:]<meta.name>:<id>`. An alias equal to a reachable document name produces references whose leading segment a reader cannot classify -- `personal:R2` reads as document `personal` to one reader and as alias `personal` to another -- and the two readings can denote different elements. The grammar may resolve it deterministically; the human or agent citing it cannot, and a citation that cannot be verified by eye is the same broken foundation R8 exists to prevent (P13/H8). An alias exists as the three-segment escape hatch FOR a collision, so it must not be the collision.

      When authoring an `inherits` entry, choose the alias against the names actually reachable in the resulting graph, not against the source repository's name -- the repository name is the likeliest thing to collide, because it is usually also the name its own root document carries.
    tags:
      - framework
      - integrity
    maps_to:
      - gvp:G5
      - gvp:V10
      - gvp:V6
      - gvp:R8
      - gvp:P14
    origin:
      - date: '2026-09-25'
        note: 'Authored because R8 covers document-name uniqueness and is silent on alias/name collision. D59 chose `as: me` over `as: personal` on exactly this reasoning, but had to argue it from scratch -- an unforced choice at the time, and one a later author had no guidance to repeat.'
      - id: f2f8af2e-216f-4d04-a73d-bc306c838ca1
        date: '2026-09-25T21:21:17.379Z'
        note: Imported from patch-guidance.yaml
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
  - id: R12
    name: A recognised namespace accepts unknown members only with a diagnostic
    statement: |
      A recognised namespace accepts unknown members only with a diagnostic. Passthrough preserves; it does not excuse silence.

      Wherever cairn recognises a container -- a document's top-level keys, `meta` and its sub-keys, an element's fields, a model's fields nested inside a list or dict -- a member of that container that cairn does not recognise must produce a diagnostic naming it. Preserving the member and warning about it are not alternatives. personal:V5 ("unknown fields are preserved, not filtered") and personal:R2 ("no silent failures") are BOTH satisfied only by doing both; preserving without warning merely trades a data-loss failure for a no-op failure, in which the user's key survives, means nothing, and nothing says so.

      Severity follows H8 -- a warning where the unknown member cannot affect the current output, an error where it can -- and stays suppressible by code under D7, so the escape hatch for a deliberately unrecognised key is the existing, explicit one rather than silence.

      The precedent exists and was simply never extended: W016 UNRECOGNIZED_YAML_KEY does exactly this for a document's TOP-LEVEL keys while the element schema stays `.passthrough()` (src/validation/passes/structural-pass.ts). `meta` sub-keys were never covered, which is why `meta.registry.enabled: false` validates clean and does nothing at all.

      SCOPE: this rule binds cairn and is NOT offered as general guidance -- see the origin note for the maintainer's verbatim reason for accepting a restriction this broad here. The reason is specific to what this project is: a library that other libraries inherit, whose entire product is the correctness of a graph its users cannot check by eye. Do not read it as a claim about namespaces in general, and do not promote it upstream.
    tags:
      - framework
      - integrity
    maps_to:
      - gvp:G8
      - gvp:V10
      - gvp:P14
      - personal:P4
      - personal:R2
      - personal:V5
    origin:
      - date: '2026-09-25'
        note: |
          Authored to resolve the personal:V5 / personal:R2 tension by construction -- preserve AND warn -- rather than leaving each author to pick a side. Surfaced by issue #25, where `meta.registry.enabled: false` is accepted, preserved, and ignored, with rc 0.
          The maintainer accepted the breadth of this rule for a project-specific reason, verbatim: "feels a little extra... I would typically object, but given the point of the project, I think I can accept that more broad restriction to help ensure correctness." Recorded here so the acceptance stays attached to its condition, and so a later author does not generalise a project-scoped concession into universal guidance.
      - id: b76a5661-bbf5-4c90-8ffe-ac367fcd0b61
        date: '2026-09-25T21:21:17.379Z'
        note: Imported from patch-guidance.yaml
        by:
          name: shaun mitchell
          email: shaun@shitchell.com
  - id: R11
    name: 'Retired: superseded by gvp:D60'
    status: deprecated
    summary: Tombstone. Superseded by gvp:D60; not guidance.
    statement: |
      RETIRED -- superseded by gvp:D60, which carries the full text as its rationale. This entry is a tombstone, not guidance: consult gvp:D60.

      Reclassified from rule to decision on maintainer review, the same day it was authored and before any dependant shipped. It describes what cairn DOES at runtime, observable by a user -- product behaviour -- rather than how this project operates while writing code, and by the source test it originated in the design phase, which makes it an architectural decision.

      Kept so the id is never reused (gvp:R1) and never silently removed (gvp:R2). Its deletion left the R11 gap that W009 reported.

decisions:
  - id: D1
    name: Walk-backwards config discovery
    rationale: |
      Searching upward from the current directory for .gvp/ mirrors how tools like git discover repositories. This allows project-level GVP stores to be found automatically without global configuration.
    tags:
      - tooling
      - usability
    maps_to:
      - gvp:G6
      - gvp:G8
      - gvp:P7
      - gvp:V4
      - gvp:V5
  - id: D2
    name: Multiple output formats from single source
    rationale: |
      Markdown for humans, CSV for spreadsheets, SQLite for queries, DOT for graph visualization. One source of truth, many views. Users should not maintain parallel representations.
    tags:
      - tooling
      - extensibility
    maps_to:
      - gvp:G1
      - gvp:G2
      - gvp:P3
      - gvp:V5
      - gvp:V7
  - id: D3
    name: Single untyped maps_to field
    rationale: |
      Typed edge mappings (supports, implements, derives_from) were considered and deferred. A single maps_to list is simpler and sufficient for current needs. Typed edges can be added later without breaking existing files.
    tags:
      - framework
      - tooling
    maps_to:
      - gvp:G2
      - gvp:V4
      - gvp:H3
  - id: D4
    name: Tags over hierarchical categories
    rationale: |
      An element can be about reliability AND usability AND code quality simultaneously. Tags let users express this without forcing a single primary classification.
    tags:

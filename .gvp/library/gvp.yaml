  - id: D41
    name: Record every document in the resolved library directory, not only inherited ones
    rationale: |
      When a library is resolved, every YAML document in it is recorded, not only the documents the current project actually inherits. This is already what the existing source loader does -- it collects every YAML file in the resolved directory rather than only the inherited ones -- so the change is to state the behavior as intended rather than incidental.
      It is load-bearing for G11. A project that inherits only code-testing from the owner's personal library would otherwise never index the personal document, and the personal document is exactly where the three elements in the motivating incident lived. Recording only what was inherited would make the feature architecturally unable to solve its own motivating case while appearing to work -- the worst available failure mode, because it produces a populated index that is silently missing the content the user needs.
    tags:
      - framework
      - tooling
      - integrity
    maps_to:
      - gvp:G11
      - gvp:V3
      - gvp:D40
    origin:
      - date: '2026-09-03'

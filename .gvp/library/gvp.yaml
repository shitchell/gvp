  - id: D11
    name: Staleness detection via update UUIDs
    rationale: |
      Each update entry has a unique ID. Each review entry lists the specific update IDs it reviewed (updates_reviewed). An element is stale when it has non-skip-review updates whose IDs do not appear in any review's updates_reviewed list. This is more precise than timestamp comparison -- it tracks exactly which changes have been reviewed and which haven't, and it respects the reviewer's actual scope (they only mark what they actually saw).

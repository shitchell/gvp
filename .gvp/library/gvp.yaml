  - id: D49
    name: Location is expressed as a source string reusing inherits grammar
    rationale: |
      The source resolver already dispatches a single source string by pattern-matching an at-sign prefix, and documentMetaSchema already names that key source in the object form of inherits. Reusing that one key and grammar means a registry entry's location IS the exact string a consumer pastes into inherits to adopt what they found. That is the end goal of a search rather than an incidental detail, and it avoids inventing a parallel location vocabulary for the same concept, per P11.
      The grammar is exactly a provider-path-commitish triple for remote sources, or a filesystem path for local ones. Issue #15 describes plain HTTP as a supported remote form; it is not -- the provider table has four entries and no HTTP path, and an https string would fall through to the local resolver and fail.

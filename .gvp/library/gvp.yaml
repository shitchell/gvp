  - id: D6
    name: Qualified IDs as universal references
    rationale: |
      All element references use document:id format. IDs are unique across the lifetime of the project, never renumbered, never reused. This enables deterministic mapping and tracing, preserves history for review and future planning, and avoids errors from renumbering.
    tags:

          email: shaun@shitchell.com
      - id: 20c689ac-3afc-4c82-9da8-74828e54dd82
        date: '2026-09-25T21:23:32.156Z'
        rationale: 'Amend the opt-out clause to count MECHANISMS rather than SPELLINGS, and admit meta.registry.enabled as a third spelling of the one mechanism registry.enabled (#25). D43''s literal "two named surfaces", and tests/registry/docs.test.ts which enforced that count, were both counting spellings; --no-registry was already a spelling, not a second mechanism. The reason the original count existed -- an env var drafted and deliberately removed, and docs must not run ahead of the decision -- survives intact and the env var stays refused. The new spelling is warranted by gvp:P19 and scoped by gvp:D60, both authored for this change (personal:P9: change the rule explicitly and form the heuristic for when old versus new applies); they were first filed as H11 and R11 and reclassified on maintainer review the same day. Decision only: no source change to the registry path, and the README must not document the spelling until it ships.'
        by:
          name: shaun mitchell
          email: shaun@shitchell.com

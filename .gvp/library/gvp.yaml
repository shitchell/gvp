      RETIRED -- superseded by gvp:D60, which carries the full text as its rationale. This entry is a tombstone, not guidance: consult gvp:D60.

      Reclassified from rule to decision on maintainer review, the same day it was authored and before any dependant shipped. It describes what cairn DOES at runtime, observable by a user -- product behaviour -- rather than how this project operates while writing code, and by the source test it originated in the design phase, which makes it an architectural decision.

      Kept so the id is never reused (gvp:R1) and never silently removed (gvp:R2). Its deletion left the R11 gap that W009 reported.

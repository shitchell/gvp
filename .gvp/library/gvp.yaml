    considered:
      keep_self_contained:
        description: Leave gvp.yaml with no `inherits` -- the library stays self-contained.
        rationale: |
          Rejected. This was the right call only while the personal library was unpublished; the maintainer's quote retires that premise. Holding it now keeps the most relevant guidance permanently uncitable and leaves the misquotation failure mode live.
        would_have_served:
          - gvp:V4
        conflicts_with:
          - gvp:G11
          - gvp:V3
          - personal:G2
      duplicate_elements_locally:
        description: Copy the needed upstream elements into gvp.yaml as gvp-native analogues.
        rationale: |
          Rejected. It buys citability with no network fetch, cache, or pin to maintain, but forks guidance that has one author: the copies drift from upstream with nothing to detect it, and a reader cannot tell a gvp-native element from a transcribed one. That is the same false-provenance failure the misquotation already demonstrated, made structural -- and it is the copy-paste that personal:V3 exists to forbid.
        would_have_served:
          - gvp:V4
        conflicts_with:
          - gvp:V2
          - gvp:V9
          - personal:V3
      name_documents_individually:
        description: Inherit only `personal` and `code-common` rather than the whole source.
        rationale: |
          Not available. Object-form `inherits` names a source, not a document, and pulls every document from it (DEC-1.7); the string form selects a document only within the same source. Pulling all six is therefore the only cross-repo form, and it is also the wanted one -- `code-testing`, `code-web`, `ai-common` and `code-realtime` are the same author's guidance and cost nothing to have resolvable.
        would_have_served:

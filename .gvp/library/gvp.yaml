          email: shaun@shitchell.com
      - id: 51a7f3bb-fbe2-44da-98f7-1cd3d9c37013
        date: '2026-09-04T21:44:20.532Z'
        rationale: 'Task 14: the default-on half is configSchema''s registry.enabled default(true); the named-opt-out half is parseConfigOptions applying --no-registry after loadConfig so no config flag can bypass it.'

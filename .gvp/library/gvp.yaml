  - id: D8
    name: Status filtering with opt-in history
    rationale: |
      Deprecated and rejected elements are excluded from validation and default renders to keep active state clean and reduce context pollution. Historical elements are accessible via --include-deprecated for review and future planning.
    tags:
      - tooling
      - usability
    maps_to:

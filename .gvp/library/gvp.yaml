  - id: D16
    name: '--document filter is consistent across subcommands with exact matching'
    rationale: |
      The `query` subcommand had a `--document` filter using substring matching (`documentPath.includes(opts.document)`), while `inspect`, `export`, and `validate` had no equivalent filter at all. Both facts are wrong under P14 (explicit over implicit) and P11 (collapse redundant mechanisms) -- a filter that exists on one subcommand but not others is inconsistent UX, and substring matching silently succeeds on typos or overlapping names. `--document <name>` now exists on all four subcommands (query, inspect, export, validate) and matches by exact `meta.name` or exact `documentPath` only. A filter that matches nothing exits 1 with a loud error instead of silently returning zero results. This also aligns with D15 -- the inherits-by-name convention -- so that the same identifier resolves a document whether it appears in `inherits:` or `--document`. The original substring behavior in `query` was intentionally removed, not preserved for backward compatibility, because substring matching was a latent footgun rather than a documented feature.
    tags:
      - tooling
      - usability
      - integrity
    maps_to:
      - gvp:G5
      - gvp:V6
      - gvp:V10
      - gvp:P11
      - gvp:P14
      - gvp:D15
    refs:

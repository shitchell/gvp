  - id: D29
    name: Requirement and Exclusion as core identity-lattice roots
    disposition: accepted
    rationale: |
      Two new root categories capture parts of a project's identity the existing taxonomy could not express. user_requirement (prefix U) is a stakeholder-decreed mandate asserted as input and NOT derivable from any value — that non-derivability is what makes it a requirement and not a rule. exclusion (prefix X) is a self-imposed out-of-scope boundary, the negative space of goals, turning "is X out of scope?" into an actual graph query. Both are structural and domain-agnostic (generic requirements-engineering vocabulary), so per R4 and H1 they belong in core, alongside goal, value, and constraint — not as user-defined custom categories. Mapping a requirement to a value means "resonates-with / partially-motivated-by," NOT "derived-from"; the under-determination residual is the decreed core.
    tags:
      - framework
      - alignment
      - extensibility
    maps_to:
      - gvp:G6
      - gvp:G9
      - gvp:V7
    considered:
      exclusion_as_polarity_facet:
        rationale: |
          Modeling exclusion as a polarity:exclude facet on requirement was rejected in favor of a named Exclusion type: one more type buys a glanceable prefix (X) and standard requirements-engineering vocabulary.

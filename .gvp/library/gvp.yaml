        date: '2026-09-25T22:10:00.000Z'
        rationale: 'Reference rewrite only, no rationale changed: the two elements this amendment leans on were reclassified on maintainer review hours after being authored -- heuristic H11 became principle gvp:P19 (its orthogonality test is a weighing call, not a checkable condition) and rule R11 became decision gvp:D60 (it describes runtime product behaviour, not how this project writes code). The amendment''s prose and maps_to now name the live ids; H11 and R11 are retired and their ids are never reused (R1).'

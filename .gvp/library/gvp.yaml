  - id: D26
    name: '--store flag for explicit GVP store root addressing'
    rationale: |
      The .gvp/ directory (containing config.yaml, library/, and project state) and the library/ subdirectory were conflated under the name "library". The --library flag only addresses the document directory; config discovery always walks back from CWD. Non-CWD libraries had no way to reach their own config. The --store flag resolves this by pointing at the store directory itself (the .gvp/ directory), which directly contains config.yaml and library/. The flag does NOT point at the parent project directory -- the .gvp/ directory IS the store, and the parent is the project directory (revised per human feedback: the initial design appended .gvp/ to the path, but Guy corrected this -- pointing at the store directly is more explicit and avoids magic path appending). "Store" was chosen because the docs already use "GVP store" in 10+ places. The flag hierarchy is explicit: --store governs both config and library by default; --library overrides just the library path; --config overrides just the config path.

  - id: D22
    name: Global project registry at ~/.gvp/registry/by-id
    rationale: |
      Builds on D21 (project_id) to enable cross-project discovery: a global directory where cairn maintains one YAML file per known project, keyed by the project's stable UUID. PMs and other consumers can walk the registry to answer questions like "what projects exist on this machine" and "when was project X last touched" without knowing where those projects live on disk.
      **Opt-in via config flag:** `registry.enabled: true` in any config layer (system, global, project, local) turns on the registry upsert. Default is disabled. The claude-worker PM and the PM's initial evaluation of this feature both independently landed on opt-in as the right default because:
      - Read commands (query, validate, export, inspect) are
        filesystem-read-only today. Adding unconditional write side
        effects would break CI sandboxes, multi-user environments,
        and auditability expectations.
      - Users who don't want the feature should never see any
        registry file appear in their home directory.
      - Users who DO want cross-project discovery can enable it
        once in `~/.config/gvp/config.yaml` and every subsequent
        cairn command on any project will upsert transparently.

      The earlier "explicit `cairn project register` command" design was considered and rejected in favor of transparent auto-upsert because (1) the claude-worker PM's use case needs the registry to stay fresh automatically as PMs move between projects, and (2) the explicit command has the same discoverability problem that D21's preflight already solves for identity backfill — users who don't know the command exists would never run it.
      **"Registry" naming, not "cache":** the data is persistent state that can't be regenerated without re-running cairn in every project that has ever been touched. The word "cache" implies "safe to delete, tool will rebuild" which is not true here.
      **Location: `~/.gvp/registry/by-id/`:** chosen over XDG (`$XDG_STATE_HOME/gvp/registry/`) for simplicity and to match the existing `~/.gvp/` convention used for personal libraries. Overridable via `GVP_REGISTRY_ROOT` env var for test isolation and custom setups. If a strict XDG user wants proper $XDG_STATE_HOME support later, it's a surface-level addition that doesn't require a decision change.
      **Entry schema (minimal, additive-extensible):**

          project_id: <uuid>
          project_name: <string>
          locations:
            - path: <absolute path>
              last_seen: <ISO 8601>
            - path: <absolute path>
              last_seen: <ISO 8601>

      project_name is derived from the project directory basename. locations is a list so the same project moved between machines or cloned to multiple directories on one machine shows up with multiple entries under the same project_id. last_seen is updated on every upsert for the location that matches the current path; a new path produces a new locations entry. Future fields can be added to the entry schema without breaking older readers, because the upsert code reads the existing entry, merges the new data, and writes back without enforcing an exhaustive schema.
      **Auto-prune on access:** when the registry upsert runs, it also walks the registry dir and removes any entry whose recorded locations are ALL gone from disk. Entries with at least one still-valid location are kept (with the gone locations trimmed). Simpler than a separate `cairn registry prune` command and keeps the registry tidy without user action.
      **Preflight integration:** the registry upsert is Phase 2 of the D21 preflight. Phase 1 (identity backfill) runs before loadConfig so the backfilled project_id is visible to the loaded config. Phase 2 runs after loadConfig because it needs to check the merged `registry.enabled` flag. Both phases are no-ops when there's no project context (`.gvp/` not found walking back from cwd).
      **Resilience:** all registry file operations are wrapped in try/catch and return silently on failure. Registry errors never block the main cairn command — the feature is non-load-bearing for correctness, and a read-only home directory or a full disk should not cause `cairn query` to fail. Corrupt registry entries are replaced on upsert and removed on prune.
      **Out of scope for this decision:** - A `cairn registry query` command to inspect/search the
        registry. Consumers walk the directory themselves via
        filesystem tools; cairn just maintains the data. A
        dedicated query command can be added as a separate
        decision if the surface grows.
      - Cross-user registry (shared team state). The registry is
        strictly per-user ($HOME-scoped).
      - Integration with external project indexers (IDEs,
        launchers). That's a consumer concern.

      **AMENDED 2026-09-03 (issue #15).** Five parts of this decision are superseded or extended. Everything not listed below stands as written.
      1. **Opt-in default reversed.** `registry.enabled` now defaults to TRUE and governs both project entries and the library entries added by D40. The opt-in default was falsified by evidence: ~5 months after this decision landed the flag was set in no config layer and the registry directory did not exist, so it had recorded nothing, ever. See D43, and D44 for why one flag governs both.
      2. **The out-of-scope note forbidding a query command no longer holds.** This decision reasoned that consumers walk the directory themselves. That was sound for a single flat keyspace; D51 splits registry state across two keyspaces and derives the usage edge by inversion, which no consumer will assemble by hand. See D54.
      3. **Silent failure amended to warn once.** This decision wrapped every registry operation and returned silently. Failures now emit at most one stderr warning per invocation, per V3. The guarantee that registry errors never fail the primary command is unchanged. See D57.
      4. **The "registry, not cache" naming argument is superseded.** This decision reasoned that "cache" wrongly implies safe-to-delete. D56 finds both halves true and states them separately: deleting is safe and breaks nothing, but rebuilding is lossy and incremental. The naming rationale above should be read as superseded by D56, not as current guidance.
      5. **The "both phases are no-op without project context" rule no longer holds universally.** D58 records library facts even when no project directory is found, because those facts are complete without one; only the usage edge is skipped. The preflight's own no-op behavior is unchanged.
      **Entry schema extended.** The schema above gains a `libraries:` list carrying the usage edge (D53) -- entries of key, `first_seen`, `last_seen`, merged rather than overwritten. This is the additive extension the schema note anticipated.
      **Prune refined by D55:** the uniform auto-prune (remove entries whose recorded paths are gone) is correct for local libraries but wrong for remote ones, which stay re-fetchable from their source string while the ref is still served.
      **Write path corrected by D52:** the bare file write above is not atomic, and combined with a prune that unlinks unparseable entries it becomes a data-loss path once recording runs for every user on every invocation. Registry writes now use temp-file-plus-rename.

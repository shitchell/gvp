  - id: H6
    name: Delegate the residual to whoever can survey the evidence faster
    statement: |
      Constrain a decision by your real requirements, then delegate what remains to whoever can gather and weigh the evidence faster. Delegation allocates comparative advantage, not disinterest, so the delegate still owes the basis for its choice.
    tags:
      - meta
    maps_to:

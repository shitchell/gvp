# GVP v1 Built-in Category Definitions
# Per DEC-9.4: loaded through same pipeline as user files (dogfooding)

_all:
  field_schemas:
    summary:
      type: string
      required: false
      display_name: "Summary"
    priority:
      type: number
      required: false
    refs:
      type: list
      required: false
      items:
        type: model
        fields:
          file:
            type: string
            required: true
          identifier:
            type: string
            required: true
          role:
            type: enum
            values: ["defines", "implements", "uses", "extends"]
            required: true

categories:
  goal:
    yaml_key: goals
    id_prefix: G
    primary_field: statement
    is_root: true
    requires_decision: true
    color: "#4CAF50"

  value:
    yaml_key: values
    id_prefix: V
    primary_field: statement
    is_root: true
    is_value_anchor: true
    color: "#2196F3"

  constraint:
    yaml_key: constraints
    id_prefix: C
    primary_field: impact
    is_root: true
    requires_decision: true
    color: "#FF9800"

  principle:
    yaml_key: principles
    id_prefix: P
    primary_field: statement
    # Anchor to any non-value root (goal+value | constraint | user_requirement |
    # exclusion). The value anchor is enforced softly and transitively by W017,
    # not by W003. See #6 / 2026-07-20-identity-lattice-design.md.
    mapping_rules:
      - [goal, value]
      - [constraint]
      - [user_requirement]
      - [exclusion]
    color: "#9C27B0"

  rule:
    yaml_key: rules
    id_prefix: R
    primary_field: statement
    mapping_rules:
      - [goal, value]
      - [constraint]
      - [user_requirement]
      - [exclusion]
    color: "#F44336"

  heuristic:
    yaml_key: heuristics
    id_prefix: H
    primary_field: statement
    mapping_rules:
      - [goal, value]
      - [constraint]
      - [user_requirement]
      - [exclusion]
      - [principle]
      - [rule]
    color: "#00BCD4"

  decision:
    yaml_key: decisions
    id_prefix: D
    primary_field: rationale
    mapping_rules:
      - [goal, value]
      - [constraint]
      - [user_requirement]
      - [exclusion]
    field_schemas:
      disposition:
        type: enum
        values: ["accepted", "declined", "deferred"]
        required: false
        display_name: "Disposition"
      considered:
        type: dict
        required: false
        display_name: "Considered alternatives"
        values:
          type: model
          fields:
            rationale:
              type: string
              required: true
            description:
              type: string
              required: false
    color: "#795548"

  milestone:
    yaml_key: milestones
    id_prefix: M
    primary_field: description
    mapping_rules:
      - [goal, value]
      - [constraint]
      - [user_requirement]
      - [exclusion]
    color: "#607D8B"

  procedure:
    yaml_key: procedures
    id_prefix: S
    primary_field: description
    mapping_rules:
      - [goal, value]
      - [constraint]
      - [user_requirement]
      - [exclusion]
    field_schemas:
      when:
        type: string
        required: false
      related:
        type: list
        required: false
        items:
          type: reference
      steps:
        type: list
        required: false
        items:
          type: model
          fields:
            id:
              type: string
              required: false
            name:
              type: string
              required: true
            description:
              type: string
              required: false
            example:
              type: string
              required: false
              display_name: "Example"
            maps_to:
              type: list
              required: false
              items:
                type: reference
            refs:
              type: list
              required: false
              items:
                type: model
                fields:
                  file:
                    type: string
                    required: true
                  identifier:
                    type: string
                    required: true
                  role:
                    type: enum
                    values: ["defines", "implements", "uses", "extends"]
                    required: true
    color: "#8BC34A"

  # Stakeholder-decreed mandate, asserted as input and NOT derivable from any
  # value (that non-derivability is what makes it a requirement and not a rule).
  # A root; requires_decision marks it as an actionable point-root that top-side
  # coverage (W018) expects to be actioned by a decision. See #7.
  user_requirement:
    yaml_key: user_requirements
    id_prefix: U
    primary_field: statement
    display_label: "User Requirement"
    is_root: true
    requires_decision: true
    color: "#E91E63"

  # Self-imposed out-of-scope boundary — the negative space of goals. A root, but
  # already its own resolution, so it self-satisfies top-side coverage (no
  # requires_decision flag). See #7 / #8.
  exclusion:
    yaml_key: exclusions
    id_prefix: X
    primary_field: statement
    display_label: "Exclusion"
    is_root: true
    color: "#37474F"
